country: { en: Italy, ru: Италия }
city: { en: Bergamo, ru: Бергамо }
name: { en: "Mon 2 Nov · Option: Bergamo's upper town by funicular", ru: "Пн, 2 ноя · Вариант: Верхний Бергамо на фуникулёре" }
place_suffix: Bergamo
summary:
  ru: "≈ 3 км пешком, 4–4,5 часа с обедом; два фуникулёра; по пути из Сирмионе в Линате"
  en: "≈ 3 km on foot, 4–4.5 hours including lunch; two funiculars; on the way from Sirmione to Linate"
intro:
  ru: |
    **Понедельник, 2 ноября.** Спокойная замена Милану: вместо мегаполиса — средневековый город на холме, куда поднимаемся на фуникулёре. Чемоданы весь день в машине, а вечером — прямо в Линате.

    **Дорога.** Выезд из отеля около **9:45** (выселение до 10:00). До Бергамо около 90 км по **A4** в сторону Милана, 1–1¼ часа; съезд **Bergamo**. В навигатор — **Garage San Marco, Bergamo**: крытый гараж в Нижнем городе на Viale Vittorio Emanuele II, около 2,50 € в час. Наверх, в Верхний город (Città Alta), на машине не едем: там **ZTL** с камерами.

    **Цены на троих, около 4,5 часа.**
    - **Гараж внизу + фуникулёр** (наш вариант): гараж ≈ 11 €; фуникулёры — 1,70 € за поездку с человека, а бесконтактной картой — не больше 4,90 € в день с человека, то есть ≤ 15 € на троих за все четыре поездки. Итого ≈ 25 €.
    - **Гараж Фара наверху, без городского фуникулёра**: 3,30 € в час ≈ 15 € + фуникулёр Сан-Виджилио ≈ 5 €. Итого ≈ 20 € — дешевле на 5 €, но без главного аттракциона. Это запасной вариант, если внизу нет мест.

    Бесконтактную карту прикладывает каждый свою — одна карта оплачивает один билет. Если валидатор на станции не принимает карту, билеты продаются в автоматах.

    **В понедельник** капелла Коллеони, скорее всего, закрыта — смотрим её фасад; базилика Санта-Мария-Маджоре открыта (пн–сб 9:00–18:00). 2 ноября — День поминовения, в церквях возможны службы.

    Маршрут: гараж → фуникулёр наверх → Via Gombito → Пьяцца-Веккья → соборная площадь → обед на Via Colleoni → Цитадель и Колле-Аперто → фуникулёр на Сан-Виджилио и обратно → прогулка по венецианским стенам → фуникулёр вниз → машина.
  en: |
    **Monday 2 November.** A gentle alternative to Milan: instead of a big city, a medieval town on a hill, reached by funicular. The suitcases stay in the car all day, and in the evening it's straight on to Linate.

    **Getting there.** Leave the hotel around **09:45** (check-out by 10:00). Bergamo is about 90 km along the **A4** towards Milan, 1–1¼ hours; exit **Bergamo**. Set the satnav to **Garage San Marco, Bergamo**: a covered garage in the lower town on Viale Vittorio Emanuele II, about €2.50 an hour. Don't drive up into the upper town (Città Alta): it's a camera-controlled **ZTL**.

    **Prices for three, about 4.5 hours.**
    - **Garage below + funicular** (the plan): garage ≈ €11; funiculars €1.70 a ride per person, or with a contactless card capped at €4.90 a day per person — ≤ €15 for the three of you for all four rides. About €25 in total.
    - **Fara garage up top, no city funicular**: €3.30 an hour ≈ €15 + the San Vigilio funicular ≈ €5. About €20 — €5 cheaper but without the main attraction. Keep it as the fallback if the garage below is full.

    Each of you taps your own contactless card — one card pays for one ticket. If a station validator won't take cards, the machines sell tickets.

    **On a Monday** the Colleoni Chapel is probably closed — enjoy its façade; the basilica of Santa Maria Maggiore is open (Mon–Sat 9:00–18:00). 2 November is All Souls' Day, so churches may hold services.

    Route: garage → funicular up → Via Gombito → Piazza Vecchia → the cathedral square → lunch on Via Colleoni → the Cittadella and Colle Aperto → the San Vigilio funicular up and back → a walk along the Venetian walls → funicular down → the car.
outro:
  ru: |
    **Вылет в Амстердам в 18:35 — машину сдать примерно к 16:15.** От Бергамо до Линате около 50 км: A4 в сторону Милана → Tangenziale Est → съезд Linate, 45–60 минут, после 17:00 — дольше. Выезжайте из Бергамо не позже 15:00.

    Перед сдачей заправьте машину, если этого требуют условия проката, — заправки есть на Viale Forlanini по пути к аэропорту. Большинство прокатных компаний принимают машины на многоуровневой стоянке **P2**, следуйте указателям «Autonoleggi / Car rental return»; точный уровень — в вашем ваучере. Заложите 20–30 минут на осмотр машины и фото, затем — в терминал на регистрацию и досмотр; рейс внутри Шенгена, паспортного контроля нет.
  en: |
    **The flight to Amsterdam is at 18:35 — return the car by about 16:15.** Bergamo to Linate is about 50 km: A4 towards Milan → Tangenziale Est → Linate exit, 45–60 minutes, longer after 17:00. Leave Bergamo by 15:00 at the latest.

    Refuel before returning if your rental terms require it — there are petrol stations on Viale Forlanini on the way to the airport. Most rental companies take cars back in the **P2** multi-storey; follow "Autonoleggi / Car rental return" signs, and check your voucher for the exact level. Allow 20–30 minutes for the inspection and photos, then head into the terminal for bag drop and security; it's a Schengen flight, so there's no passport control.
points:
  - name: { en: Garage San Marco, ru: Гараж San Marco }
    place: "Garage San Marco, Bergamo"
    lat: 45.69779
    lng: 9.66710
    radius_m: 150
    short:
      ru: |
        Старт около 10:45. Крытый гараж в Нижнем городе. Чемоданы — в багажник, в салоне ничего не оставляйте.
      en: |
        Start around 10:45. A covered garage in the lower town. Suitcases in the boot; leave nothing visible inside.
    long:
      ru: |
        Бергамо — два города в одном: внизу Città Bassa с проспектами XIX–XX веков, наверху, на холме за стенами, — средневековый Città Alta. Их и соединяет фуникулёр.

        Совет: сфотографируйте этаж и номер места. Машины с багажом на виду — любимая добыча воров в туристических городах, поэтому всё в багажник ещё до въезда в гараж.
      en: |
        Bergamo is two towns in one: down below, the Città Bassa with its 19th–20th-century avenues; up on the hill behind the walls, the medieval Città Alta. The funicular links them.

        Tip: photograph your level and bay number. Cars with luggage on show are a favourite target for thieves in tourist towns, so put everything in the boot before you pull in.

  - name: { en: "Funicular up to the Città Alta", ru: "Фуникулёр в Верхний город" }
    place: "Funicolare Città Alta, Viale Vittorio Emanuele II, Bergamo"
    lat: 45.70092
    lng: 9.66520
    radius_m: 80
    walk_min: [5, 6]
    visit_min: [5, 10]
    short:
      ru: |
        Вверх по Viale Vittorio Emanuele II к нижней станции. Вагончик идёт несколько минут, наверху — площадь Меркато-делле-Скарпе.
      en: |
        Up Viale Vittorio Emanuele II to the lower station. The car takes a few minutes; at the top is Piazza Mercato delle Scarpe.
    long:
      ru: |
        Фуникулёр работает с 1887 года и поднимается почти до самых ворот старого города, сквозь сады и мимо венецианских стен. Вагоны ходят каждые несколько минут.

        Совет: садитесь в нижнюю часть вагона лицом назад — пока поднимаетесь, под вами раскрывается весь Нижний город.
      en: |
        The funicular has run since 1887, climbing through gardens and past the Venetian walls almost to the old town's gates. Cars run every few minutes.

        Tip: sit at the lower end of the car facing backwards — the whole lower town opens out beneath you as you climb.

  - name: { en: Via Gombito and the Gombito Tower, ru: Улица Гомбито и башня Гомбито }
    lat: 45.70374
    lng: 9.66389
    radius_m: 80
    approach: [{ name: Piazza Mercato delle Scarpe, lat: 45.70310, lng: 9.66525 }]
    walk_min: 3
    visit_min: [10, 15]
    short:
      ru: |
        От верхней станции — по главной улице старого города, слегка в горку. На полпути — каменная башня XII века.
      en: |
        From the top station along the old town's main street, gently uphill. Halfway along is a 12th-century stone tower.
    long:
      ru: |
        Via Gombito и её продолжение Via Colleoni горожане зовут «Корсарола» — это главная улица Верхнего города: лавки, пекарни, кафе. **Башня Гомбито** высотой около 50 метров — одна из немногих сохранившихся средневековых башен знатных семей; у её подножия — туристический офис.

        Совет: в витринах кондитерских ищите «**полента э озеи**» — жёлтый купол из бисквита и марципана с шоколадными птичками сверху. Это сладкая шутка над местным блюдом — полентой с жареными птичками.
      en: |
        Via Gombito and its continuation, Via Colleoni, are known locally as the "Corsarola" — the upper town's main street of shops, bakeries and cafés. The **Gombito Tower**, about 50 metres tall, is one of the few surviving medieval towers of noble families; the tourist office is at its foot.

        Tip: look in the pastry-shop windows for "**polenta e osei**" — a yellow dome of sponge and marzipan topped with chocolate birds, a sweet joke on the local dish of polenta with roast songbirds.

  - name: { en: Piazza Vecchia, ru: Пьяцца-Веккья }
    lat: 45.70404
    lng: 9.66290
    radius_m: 80
    walk_min: 2
    visit_min: [15, 20]
    short:
      ru: |
        Главная площадь Верхнего города: аркады палаццо делла Раджоне, фонтан Контарини, башня Кампаноне. Есть скамейки.
      en: |
        The upper town's main square: the arcades of the Palazzo della Ragione, the Contarini fountain and the Campanone tower. There are benches.
    long:
      ru: |
        С 1428 по 1797 год Бергамо принадлежал Венеции — отсюда **лев святого Марка** на фасаде **палаццо делла Раджоне**, старой ратуши. Под её аркадами на мостовой — **меридиан** XVIII века: в полдень луч солнца из отверстия в своде падает точно на линию. Напротив — белый **Палаццо Нуово** по проекту Винченцо Скамоцци; строить начали в 1604 году, а фасад закончили только в 1928-м. Сейчас там библиотека Анджело Маи.

        Что посмотреть: **фонтан Контарини** 1780 года — подарок венецианского градоначальника; **Кампаноне**, городскую башню высотой около 52 метров. Её колокол каждый вечер в 22:00 бьёт 100 раз — когда-то это был сигнал закрывать городские ворота. Площадь часто называют одной из красивейших в Европе; эти слова приписывают Ле Корбюзье.

        Совет: на Кампаноне есть лифт, но в понедельник башня может быть закрыта — проверьте на месте.
      en: |
        From 1428 to 1797 Bergamo belonged to Venice — hence the **lion of St Mark** on the **Palazzo della Ragione**, the old town hall. Under its arcades a **meridian line** runs across the paving: at noon a beam of sun through a hole in the vault lands right on it. Opposite stands the white **Palazzo Nuovo**, designed by Vincenzo Scamozzi; work began in 1604 and the façade was only finished in 1928. It now houses the Angelo Mai library.

        Look at the **Contarini fountain** of 1780, a gift from a Venetian governor, and the **Campanone**, the civic tower, about 52 metres high. Every evening at 22:00 its bell strikes 100 times — once the signal to shut the city gates. The square is often called one of the most beautiful in Europe, words attributed to Le Corbusier.

        Tip: the Campanone has a lift, but on a Monday the tower may be closed — check when you're there.

  - name: { en: "Colleoni Chapel and Santa Maria Maggiore", ru: "Капелла Коллеони и Санта-Мария-Маджоре" }
    place: "Piazza Duomo, Bergamo"
    lat: 45.70335
    lng: 9.66215
    radius_m: 80
    walk_min: 2
    visit_min: [25, 35]
    short:
      ru: |
        Под аркадами палаццо делла Раджоне — на соседнюю соборную площадь. Пёстрый мраморный фасад капеллы, рядом вход в базилику — внутри можно посидеть.
      en: |
        Through the Palazzo della Ragione arcades into the cathedral square next door. The chapel's multicoloured marble façade, and beside it the basilica — somewhere to sit inside.
    long:
      ru: |
        **Бартоломео Коллеони** (около 1395–1475) — кондотьер, командующий армией Венеции и самый богатый человек Бергамо. Себе в усыпальницу он построил **капеллу** (1472–1476, архитектор Джованни Антонио Амадео), а чтобы освободить место, велел снести ризницу соседней базилики. Фасад из белого, розового и чёрного мрамора — одна из жемчужин ломбардского Возрождения; внутри — его гробница и фрески Тьеполо. На решётке ограды — герб Коллеони с тремя парами… «coglioni»: фамилия звучит почти как итальянское слово «яички». Потереть герб на удачу — местная традиция.

        Что посмотреть: **Санта-Мария-Маджоре** (начата в 1137 году) снаружи строгая романская, с порталом на львах, а внутри — сплошное барочное золото. Здесь гробница композитора **Гаэтано Доницетти**, уроженца Бергамо, и деревянные интарсии хора по рисункам Лоренцо Лотто. Рядом — восьмигранный **баптистерий** XIV века, который в XIX веке перенесли сюда из базилики, и собор города.

        Совет: в понедельник капелла, скорее всего, закрыта, но фасад и герб — снаружи. В базилике тепло и есть скамьи — хорошая передышка перед обедом.
      en: |
        **Bartolomeo Colleoni** (c. 1395–1475) was a condottiero, captain-general of Venice's army and the richest man in Bergamo. He built the **chapel** as his tomb (1472–1476, by Giovanni Antonio Amadeo), having the next-door basilica's sacristy knocked down to make room. Its façade of white, pink and black marble is a jewel of the Lombard Renaissance; inside are his tomb and frescoes by Tiepolo. On the railing outside is his coat of arms with three pairs of… "coglioni": his surname sounds almost like the Italian for testicles. Rubbing the crest for luck is a local habit.

        **Santa Maria Maggiore** (begun 1137) is plain Romanesque outside, with a porch on lions, and a riot of Baroque gold inside. It holds the tomb of the composer **Gaetano Donizetti**, born in Bergamo, and wooden choir inlays designed by Lorenzo Lotto. Beside it are the octagonal 14th-century **baptistery**, moved here from inside the basilica in the 19th century, and the city cathedral.

        Tip: on a Monday the chapel is probably closed, but the façade and the crest are outside. The basilica is warm and has pews — a good rest before lunch.

  - name: { en: "Lunch on Via Colleoni", ru: "Обед на Via Colleoni" }
    place: "Via Bartolomeo Colleoni, Bergamo"
    lat: 45.70490
    lng: 9.66120
    radius_m: 150
    walk_min: 3
    visit_min: [60, 75]
    short:
      ru: |
        Обед сидя в одной из траттор на Via Colleoni. Местное — казончелли и полента.
      en: |
        A sit-down lunch at one of the trattorias on Via Colleoni. Eat local: casoncelli and polenta.
    long:
      ru: |
        Кухня Бергамо — горная и сытная. **Казончелли алла бергамаска** — пельмени-полумесяцы с начинкой из мяса, хлеба, сыра и иногда амаретти и изюма, под растопленным маслом с шалфеем и панчеттой. **Полента таранья** — из кукурузной и гречневой муки, с расплавленным сыром; к ней — тушёное мясо или грибы.

        Совет: столики у окна на втором этаже — с видом на улицу. Если хочется полегче, в пекарнях на Корсароле продают кусками фокаччу и пиццу.
      en: |
        Bergamo's cooking is hearty mountain food. **Casoncelli alla bergamasca** are half-moon pasta parcels stuffed with meat, bread, cheese and sometimes amaretti and raisins, served with melted butter, sage and pancetta. **Polenta taragna** is made with maize and buckwheat and melted cheese, served with stews or mushrooms.

        Tip: upstairs window tables look down on the street. For something lighter, the Corsarola bakeries sell focaccia and pizza by the slice.

  - name: { en: The Cittadella and Colle Aperto, ru: Цитадель и Колле-Аперто }
    place: "Piazza della Cittadella, Bergamo"
    lat: 45.70578
    lng: 9.65939
    radius_m: 120
    walk_min: 3
    visit_min: [15, 20]
    short:
      ru: |
        Через ворота во двор цитадели, затем на площадь Колле-Аперто. Мороженое — в La Marianna, где придумали страччателлу.
      en: |
        Through the gate into the citadel courtyard, then on to Colle Aperto. Ice cream at La Marianna, where stracciatella was invented.
    long:
      ru: |
        Цитадель построили в 1350-х годах миланские правители Висконти — до Венеции Бергамо принадлежал Милану. Сейчас во дворе тихо, а в зданиях — музеи естественной истории и археологии.

        Совет: в кафе-кондитерской **La Marianna** на Колле-Аперто в 1961 году Энрико Панаттони влил горячий шоколад в сливочное мороженое — так появилась **страччателла**. Её делают здесь до сих пор. Рядом — нижняя станция фуникулёра на Сан-Виджилио.
      en: |
        The citadel was built in the 1350s by the Visconti of Milan — before Venice, Bergamo belonged to Milan. Today the courtyard is quiet, and the buildings house the natural history and archaeology museums.

        Tip: at the **La Marianna** café on Colle Aperto, in 1961, Enrico Panattoni poured hot chocolate into cream gelato — and **stracciatella** was born. They still make it here. The San Vigilio funicular's lower station is right nearby.

  - name: { en: "San Vigilio funicular and view", ru: "Фуникулёр на Сан-Виджилио и вид" }
    place: "Funicolare di San Vigilio, Bergamo"
    lat: 45.70875
    lng: 9.65293
    radius_m: 120
    walk_min: [3, 5]
    visit_min: [30, 40]
    short:
      ru: |
        Второй фуникулёр — короткий и крутой, с Колле-Аперто на холм Сан-Виджилио, ещё выше Верхнего города. Наверху — смотровая площадка, потом тем же вагоном вниз.
      en: |
        The second funicular — short and steep, from Colle Aperto up San Vigilio hill, above the upper town. A viewpoint at the top, then back down the same way.
    long:
      ru: |
        Фуникулёр Сан-Виджилио открыли в 1912 году; это самый крутой участок дня, но преодолевает его вагон. Сверху видно весь Верхний город с куполами и башнями, равнину до Милана, а в ясную погоду — Альпы на севере.

        Совет: от верхней станции к руинам замка Сан-Виджилио ведёт крутая улочка, минут 5–10, — по желанию и по силам. Наверху ветрено, пригодится кофта.
      en: |
        The San Vigilio funicular opened in 1912; it's the steepest stretch of the day, but the car does the climbing. From the top you see the whole upper town with its domes and towers, the plain stretching to Milan, and on a clear day the Alps to the north.

        Tip: a steep lane leads from the top station to the ruins of San Vigilio castle, 5–10 minutes — only if you feel like it. It's windy up there, so bring a layer.

  - name: { en: The Venetian walls, ru: Венецианские стены }
    place: "Porta San Giacomo, Bergamo"
    lat: 45.70124
    lng: 9.66302
    radius_m: 120
    approach: [{ name: Porta Sant'Alessandro, lat: 45.70646, lng: 9.65787 }, { name: Viale delle Mura, lat: 45.70295, lng: 9.66019 }]
    walk_min: [15, 20]
    visit_min: [10, 15]
    short:
      ru: |
        Вниз фуникулёром на Колле-Аперто, через ворота Сант-Алессандро и по бульвару вдоль стен — ровно и с видом на Нижний город. Финиш у белых ворот Сан-Джакомо.
      en: |
        Back down by funicular to Colle Aperto, through Porta Sant'Alessandro and along the boulevard on top of the walls — flat, with views over the lower town. Finish at the white Porta San Giacomo.
    long:
      ru: |
        Стены Венеция строила в 1561–1588 годах, чтобы защитить западный рубеж республики, — больше 5 километров бастионов вокруг всего холма. Ради них снесли сотни домов и несколько церквей. Ирония в том, что стены так и не выдержали ни одной осады: их ни разу не штурмовали. С 2017 года они в списке Всемирного наследия ЮНЕСКО вместе с другими венецианскими крепостями.

        Что посмотреть: **Порта Сан-Джакомо** из белого мрамора смотрит на юг, в сторону Милана, — самые нарядные из четырёх ворот. Внизу — Нижний город и равнина; в ясный день видны небоскрёбы Милана.

        Совет: вдоль бульвара много скамеек под каштанами — отдыхайте, сколько нужно.
      en: |
        Venice built the walls in 1561–1588 to guard the Republic's western frontier — more than 5 km of bastions around the whole hill. Hundreds of houses and several churches were demolished to make way. The irony is that they never faced a siege: no one ever attacked them. Since 2017 they've been a UNESCO World Heritage Site together with other Venetian fortresses.

        **Porta San Giacomo**, in white marble, faces south towards Milan — the grandest of the four gates. Below are the lower town and the plain; on a clear day you can see Milan's skyscrapers.

        Tip: there are plenty of benches under the chestnut trees along the boulevard — rest as long as you like.

  - name: { en: Funicular back down, ru: Фуникулёр вниз }
    place: "Piazza Mercato delle Scarpe, Bergamo"
    lat: 45.70310
    lng: 9.66525
    radius_m: 80
    walk_min: [5, 7]
    visit_min: [5, 10]
    short:
      ru: |
        От ворот Сан-Джакомо — обратно вверх на пару минут к верхней станции на площади Меркато-делле-Скарпе и вниз фуникулёром.
      en: |
        From Porta San Giacomo, a couple of minutes back uphill to the top station on Piazza Mercato delle Scarpe, and down by funicular.
    long:
      ru: |
        «Меркато делле Скарпе» значит «обувной рынок»: здесь торговали башмачники. Сейчас это маленькая площадь с кафе прямо у станции фуникулёра.

        Совет: если остались силы и время, последний кофе — за столиком на площади, пока ждёте вагон.
      en: |
        "Mercato delle Scarpe" means "shoe market": the cobblers traded here. Today it's a small square with cafés right by the funicular station.

        Tip: if you have the time and the energy, have a last coffee at a table on the square while you wait for the car.

  - name: { en: Back to the car, ru: Обратно к машине }
    place: "Garage San Marco, Bergamo"
    lat: 45.69779
    lng: 9.66710
    radius_m: 150
    approach: [{ name: Funicular lower station, lat: 45.70092, lng: 9.66520 }]
    walk_min: [5, 6]
    short:
      ru: |
        Финиш. От нижней станции вниз по Viale Vittorio Emanuele II к гаражу. Дальше — в Линате, 45–60 минут; выезжайте не позже 15:00.
      en: |
        Finish. From the lower station down Viale Vittorio Emanuele II to the garage. Then on to Linate, 45–60 minutes; leave by 15:00 at the latest.
    long:
      ru: |
        Оплатите парковку в автомате на выходе — картой или наличными — и сохраните чек.

        Совет: в навигатор — «Aeroporto di Milano Linate, autonoleggi» или адрес стоянки P2 из ваучера проката.
      en: |
        Pay at the machine on your way out, by card or cash, and keep the receipt.

        Tip: set the satnav to "Aeroporto di Milano Linate, autonoleggi", or to the P2 car park address in your rental voucher.
