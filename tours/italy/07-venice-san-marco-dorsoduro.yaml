country: {en: Italy, ru: Италия}
city: {en: Venice, ru: Венеция}
name: {en: "Fri 30 Oct · Doge's Palace, St Mark's, the Salute and sunset on the Zattere", ru: "Пт, 30 окт · Дворец дожей, Сан-Марко, Салюте и закат на Дзаттере"}
place_suffix: Venezia
summary:
  ru: "≈ 3 км пешком, с 9:15 до вечера; три вапоретто; брони: дворец в 10:30, собор в 13:30"
  en: "≈ 3 km on foot, from 09:15 into the evening; three vaporetto rides; booked: the palace at 10:30, the basilica at 13:30"
intro:
  ru: |
    Пятница, 30 октября. Утром вдвоём — Дворец дожей; третий участник отсыпается и присоединяется в 13:15 у собора Святого Марка. Дальше все вместе: собор, поздний обед сидя, катер к церкви Салюте, закат и спритц на набережной Дзаттере, катер домой. Длинных пеших переходов нет: между точками — по 3–10 минут или вапоретто.

    **Забастовка 30 октября** транспорт не затрагивает: по данным ACTV от 28 октября, автобусы, вапоретто и People Mover работают в обычном режиме (бастуют только парковки AVM и кассы Venezia Unica). Отдельные отмены рейсов возможны — если катер не пришёл, ждите следующий.

    **Брони сделаны.**
    - **Дворец дожей** — **10:30**, на двоих (билет «Музеи площади Сан-Марко»; слот в музей Коррер в 16:50 — для галочки, идти не нужно). Очередь по брони с досмотром — 5–15 минут.
    - **Собор Святого Марка** — **13:30** (вход до 14:00), на троих. Пала д’Оро и Музей с лоджией коней в билет не входят.

    **Дорога.** Вдвоём — выход около **9:15**: автобус № 6 до Пьяццале Рома, оттуда вапоретто **№ 2** до San Marco (Giardinetti), около 30 минут. Третий участник — выход около **12:00** тем же путём, встреча в **13:15** у камеры хранения Атенео Сан-Бассо, слева от собора. Проездной на 72 часа, купленный вчера, покрывает всё.

    **Ритм.** Присесть можно каждые 30–45 минут: катер, кафе во дворе дворца, кофе после дворца, обед, катер, ступени Салюте, спритц на Дзаттере.

    Закат около **17:00** — его встречаем на Дзаттере. Салюте открывается после обеденного перерыва в 15:00.
  en: |
    Friday 30 October. In the morning, two of you do the Doge's Palace; the third person sleeps in and joins at 13:15 at St Mark's Basilica. Then all together: the basilica, a late sit-down lunch, a boat to the Salute church, sunset and a spritz on the Zattere, and the boat home. No long walks: 3–10 minutes between stops, or a vaporetto.

    **The 30 October strike** doesn't affect transport: ACTV confirmed on 28 October that buses, vaporetti and the People Mover run as normal (only the AVM car parks and the Venezia Unica ticket desks are on strike). The odd cancelled run is possible — if a boat doesn't come, wait for the next.

    **Booked.**
    - **Doge's Palace** at **10:30**, for two (the "St Mark's Square Museums" ticket; the 16:50 Museo Correr slot was only required to complete the purchase — no need to go). The booked queue plus security takes 5–15 minutes.
    - **St Mark's Basilica** at **13:30** (entry until 14:00), for three. The Pala d'Oro and the Museum with the Horses' Loggia aren't included.

    **Getting there.** The two of you leave around **09:15**: bus no. 6 to Piazzale Roma, then vaporetto **no. 2** to San Marco (Giardinetti), about 30 minutes. The third person leaves around **12:00** the same way and meets you at **13:15** at the Ateneo San Basso left-luggage, to the left of the basilica. Yesterday's 72-hour pass covers it all.

    **Pace.** There's a chance to sit every 30–45 minutes: the boat, the palace courtyard café, coffee after the palace, lunch, the boat, the Salute steps, a spritz on the Zattere.

    Sunset is around **17:00**, to be watched from the Zattere. The Salute reopens after its lunch break at 15:00.
outro:
  ru: |
    Обратно — автобус № 6 с Пьяццале Рома до Via Paleocapa; последние рейсы — в 23:10, 23:25 и 23:50.

    Завтра — острова: Сан-Микеле, Мурано, Бурано и обед в Gatto Nero, все вместе. Подъём около 8:30, выход около 9:45.
  en: |
    Head back on bus no. 6 from Piazzale Roma to Via Paleocapa; the last departures are at 23:10, 23:25 and 23:50.

    Tomorrow is the islands: San Michele, Murano, Burano and lunch at Gatto Nero, all together. Up around 08:30, out around 09:45.
points:
  - name: {en: hu Venezia camping in town, ru: Кемпинг hu Venezia camping in town}
    place: "hu Venezia camping in town, Via Giuseppe De Marchi 7, Marghera"
    lat: 45.47240
    lng: 12.21200
    radius_m: 250
    short:
      ru: |
        Вдвоём — старт около 9:15. Третий участник — около 12:00. До остановки автобуса 12–15 минут пешком через подземный переход.
      en: |
        The two of you start around 09:15; the third person around 12:00. The bus stop is 12–15 minutes' walk through the underpass.
    long:
      ru: |
        Путь до остановки тот же, что вчера: велодорожка вдоль Via De Marchi, подземный переход под съездом, Via della Fonte мимо спортивного центра, налево по Via Cesare Beccaria до Via Paleocapa.

        Совет: проверьте, что билеты во дворец и собор открываются в телефоне без интернета (сделайте скриншоты QR-кодов), и перешлите третьему участнику его билет в собор — он именной. Возьмите шарф или кофту, чтобы прикрыть плечи в соборе, и небольшую сумку: с рюкзаком в собор не пустят.
      en: |
        Same way to the stop as yesterday: the cycle path along Via De Marchi, the underpass beneath the ramp, Via della Fonte past the sports centre, then left up Via Cesare Beccaria to Via Paleocapa.

        Tip: make sure the palace and basilica tickets open on your phone offline (screenshot the QR codes), and forward the third person their basilica ticket — it's in their name. Bring a scarf or cardigan to cover shoulders in the basilica, and a small bag: backpacks aren't allowed inside.

  - name: {en: "Bus stop Paleocapa (line 6)", ru: "Остановка Paleocapa (автобус № 6)"}
    place: "45.47691,12.22017"
    lat: 45.47691
    lng: 12.22017
    approach:
      - {name: Underpass, lat: 45.47117, lng: 12.21330}
      - {name: Via della Fonte, lat: 45.47340, lng: 12.21600}
      - {name: Via Cesare Beccaria, lat: 45.47427, lng: 12.21929}
    walk_min: [12, 15]
    short:
      ru: |
        Автобус № 6 в сторону Venezia, 10–15 минут до Пьяццале Рома. Утром в час пик автобусы полнее — заложите запас.
      en: |
        Bus no. 6 towards Venezia, 10–15 minutes to Piazzale Roma. Morning rush-hour buses are fuller, so allow some slack.
    long:
      ru: |
        Автобусы ходят примерно каждые 20 минут. Чтобы успеть к 10:30 во дворец, нужно быть на Пьяццале Рома не позже 9:45; третьему участнику, чтобы успеть к 13:15, — не позже 12:30.

        Совет: если автобус задерживается, можно ехать и на любом другом в сторону Venezia — на Пьяццале Рома приходят все.
      en: |
        Buses run about every 20 minutes. To make the 10:30 palace slot you need to be at Piazzale Roma by 09:45 at the latest; for the third person to make 13:15, by 12:30.

        Tip: if the bus is late, any other bus towards Venezia from this stop will do — they all end at Piazzale Roma.

  - name: {en: "Piazzale Roma — vaporetto 2", ru: "Пьяццале Рома — вапоретто № 2"}
    place: "Piazzale Roma, Venezia"
    lat: 45.43801
    lng: 12.31885
    radius_m: 250
    visit_min: [30, 35]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/03.mp3}
    short:
      ru: |
        С причала Piazzale Roma — линия **2** в сторону **Rialto** до **San Marco (Giardinetti)**, около 30 минут. Если рейс № 2 заканчивается на Rialto (так бывает), пересядьте там на № 1. Резервный вариант — сразу № 1, ~45 минут.
      en: |
        From the Piazzale Roma pier take line **2** towards **Rialto** to **San Marco (Giardinetti)**, about 30 minutes. If the line 2 boat terminates at Rialto (some do), change to line 1 there. The fallback is line 1 all the way, ~45 minutes.
    long:
      ru: |
        Линия 2 — «экспресс» по Гранд-каналу: останавливается только на главных причалах — Ferrovia, Rialto, San Tomà, Accademia, San Marco. Утром канал совсем другой, чем вчера вечером: по нему идут грузовые лодки с продуктами, мусором и стройматериалами — вся логистика города.

        Совет: от Giardinetti до входа во дворец — 5 минут пешком вдоль воды мимо Пьяцетты. Вход по билетам — через **Порта-дель-Фрументо** со стороны набережной.
      en: |
        Line 2 is the Grand Canal "express": it stops only at the main piers — Ferrovia, Rialto, San Tomà, Accademia, San Marco. The canal in the morning is nothing like last night: barges carry food, rubbish and building materials — the whole logistics of the city.

        Tip: from Giardinetti to the palace entrance is 5 minutes along the water past the Piazzetta. Ticket holders enter through the **Porta del Frumento** on the waterfront side.

  - name: {en: "Doge's Palace", ru: Дворец дожей}
    place: "Palazzo Ducale, Venezia"
    lat: 45.43400
    lng: 12.34040
    approach: [{name: Piazzetta San Marco, lat: 45.43355, lng: 12.33985}]
    walk_min: 5
    visit_min: [110, 120]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/04.mp3}
    short:
      ru: |
        Вдвоём, вход по брони в 10:30 через Порта-дель-Фрументо. Около двух часов по одностороннему маршруту: парадные залы, Зал Большого совета, Мост вздохов и тюрьмы. Выйти около **12:30** — до встречи у собора в 13:15 есть время на кофе с тост-сэндвичем в баре за причалом San Zaccaria.
      en: |
        The two of you, entering with the 10:30 booking through the Porta del Frumento. About two hours on a one-way route: the state rooms, the Great Council Hall, the Bridge of Sighs and the prisons. Out around **12:30** — before the 13:15 meet-up at the basilica there's time for a coffee and a toasted sandwich at a bar behind the San Zaccaria pier.
    long:
      ru: |
        Резиденция дожа и одновременно всё правительство Венецианской республики: советы, суды, канцелярия и тюрьма под одной крышей. Нынешний готический облик сложился в XIV–XV веках; розово-белый фасад с ажурными лоджиями, будто стоящий на кружеве, — уникальный венецианский стиль, перевернувший привычную логику «тяжёлый низ — лёгкий верх».

        Что посмотреть: **Лестница гигантов** во дворе со статуями Марса и Нептуна; **Золотая лестница**; залы Коллегии и Сената с плафонами Веронезе и Тинторетто; «львиные пасти» — щели для анонимных доносов; **Зал Большого совета** с «Раем» Тинторетто, одним из самых больших холстов в мире, и фризом с портретами дожей, где вместо портрета Марино Фальера, казнённого за заговор в 1355 году, — чёрное покрывало. Затем — через **Мост вздохов** в Новые тюрьмы.

        **Что ожидать.** Около километра по залам и много лестниц: Золотая лестница сразу поднимает на два этажа, в тюрьмах — узкие крутые ступени и холод. Скамейки есть вдоль стен Зала Большого совета, в остальных залах присесть почти негде; перед началом маршрута — кафе и туалеты во дворе. Если тяжело — пропустите оружейную (лишние лестницы), а после Зала Большого совета спросите смотрителя о самом коротком пути к выходу. Про лифт для маломобильных посетителей спросите на входе.

        Подробный маршрут по залам с аудиорассказами — [Дворец дожей по залам](#/tour/italy/07-venice-doges-palace/1).
      en: |
        The Doge's residence and the entire government of the Venetian Republic: councils, courts, chancery and prison under one roof. Its present Gothic form took shape in the 14th–15th centuries; the pink-and-white façade with lacy loggias that seems to rest on lace is a uniquely Venetian style that turns the usual "heavy below, light above" logic upside down.

        Look for the **Giants' Staircase** in the courtyard with its statues of Mars and Neptune; the **Golden Staircase**; the Collegio and Senate halls with ceilings by Veronese and Tintoretto; the "lion's mouths", slots for anonymous denunciations; and the **Great Council Hall** with Tintoretto's "Paradise", among the biggest canvases in the world, and a frieze of doges' portraits where Marino Faliero, executed for conspiracy in 1355, is replaced by a black shroud. Then through the **Bridge of Sighs** to the New Prisons.

        **What to expect.** About a kilometre of rooms and plenty of stairs: the Golden Staircase takes you up two floors at once, and the prisons have narrow, steep steps and a chill. There are benches along the walls of the Great Council Hall; elsewhere there's hardly anywhere to sit, but there's a café and toilets in the courtyard before the route starts. If it's hard going, skip the armoury (extra stairs), and after the Great Council Hall ask an attendant for the shortest way out. Ask at the entrance about the lift for visitors with limited mobility.

        A room-by-room route with audio narration: [The Doge's Palace room by room](#/tour/italy/07-venice-doges-palace/1).

  - name: {en: "St Mark's Basilica", ru: Собор Святого Марка}
    place: "Basilica di San Marco, Venezia"
    lat: 45.43455
    lng: 12.33982
    walk_min: 5
    visit_min: [40, 50]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/05.mp3}
    short:
      ru: |
        **Встреча в 13:15** у камеры хранения Атенео Сан-Бассо (слева от собора): туда рюкзаки и большие сумки, бесплатно, до 1 часа. Вход по брони в 13:30 (до 14:00) с площади, все трое. Плечи и колени закрыты.
      en: |
        **Meet at 13:15** at the Ateneo San Basso left-luggage (to the left of the basilica): backpacks and large bags go there, free, up to 1 hour. Enter with the 13:30 booking (valid until 14:00) from the square, all three of you. Shoulders and knees covered.
    long:
      ru: |
        Собор построили в XI веке как дворцовую капеллу дожей для мощей евангелиста Марка: в 828 году их выкрали из Александрии венецианские купцы, по легенде спрятав под свининой, чтобы мусульманские таможенники не стали досматривать груз. Кафедральным собором города он стал только в 1807 году.

        Что посмотреть: больше 8000 квадратных метров **золотых мозаик** XII–XIII веков на куполах и сводах — когда глаза привыкнут к полумраку, весь собор светится золотом; волнистый мозаичный пол, «поплывший» за века от осадки свай. За отдельный билет — **Пала д’Оро**, золотой алтарный образ с почти двумя тысячами драгоценных камней, и **Музей** с лоджией: крутая лестница наверх, к подлинным бронзовым **коням святого Марка**, и балкон над площадью — лучший вид на Сан-Марко сверху.

        Совет: маршрут внутри ровный и короткий, но пол неровный — смотрите под ноги. В лоджию можно подняться без мамы — она подождёт внизу. Фотографировать внутри, как правило, нельзя.

        Подробный маршрут с аудиорассказами — [Собор Святого Марка по шагам](#/tour/italy/07-venice-st-marks-basilica/1).
      en: |
        The basilica was built in the 11th century as the Doges' palace chapel to hold the relics of St Mark the Evangelist, stolen from Alexandria by Venetian merchants in 828 — hidden, legend says, under pork so that Muslim customs officers wouldn't search the load. It only became the city's cathedral in 1807.

        Look at more than 8,000 square metres of 12th–13th-century **golden mosaics** on the domes and vaults — once your eyes adjust to the dim light, the whole church glows gold — and the undulating mosaic floor, warped over the centuries as the piles settled. With an extra ticket: the **Pala d'Oro**, a golden altarpiece set with almost two thousand gems, and the **Museum** with the loggia: a steep staircase up to the original bronze **Horses of St Mark** and a balcony over the square — the best view down onto St Mark's.

        Tip: the route inside is flat and short, but the floor is uneven — watch your step. The loggia can be done without mum, who waits below. Photography is generally not allowed inside.

        A step-by-step route with audio narration: [St Mark's Basilica step by step](#/tour/italy/07-venice-st-marks-basilica/1).

  - name: {en: "Lunch off the Riva degli Schiavoni", ru: "Обед у Рива-дельи-Скьявони"}
    place: "Campo Bandiera e Moro, Venezia"
    lat: 45.43460
    lng: 12.34665
    approach:
      - {name: Ponte della Paglia, lat: 45.43365, lng: 12.34101}
      - {name: Chiesa della Pietà, lat: 45.43375, lng: 12.34560}
    walk_min: [8, 10]
    visit_min: [60, 75]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/06.mp3}
    short:
      ru: |
        По набережной на восток: с моста Палья — вид на Мост вздохов, мимо церкви Пьета до тихого кампо Бандьера-э-Моро. Обед сидя — в переулках за площадью, а не на самой набережной. Идите сразу после собора и садитесь **до 14:30**: многие кухни после этого перестают принимать заказы. Если опоздали — бакаро с чиккетти или место с «orario continuato» (кухня без перерыва).
      en: |
        East along the waterfront: the Bridge of Sighs view from the Ponte della Paglia, past the Pietà church to quiet Campo Bandiera e Moro. A sit-down lunch in the alleys behind the square rather than on the quay itself. Go straight from the basilica and be seated **by 14:30**: many kitchens stop taking orders after that. If you're late, a bacaro with cicchetti or a place with "orario continuato" (kitchen open all day).
    long:
      ru: |
        «Набережная славян»: здесь швартовались торговцы из Далмации — «скьявони», как венецианцы называли славян с восточного берега Адриатики. Сегодня это самая парадная набережная города: гостиница **Даниэли** в готическом палаццо XIV века и вид через бассейн на остров Сан-Джорджо-Маджоре с белой церковью Палладио.

        Что посмотреть: с **моста Палья** — **Мост вздохов**, по которому осуждённых вели из дворца в тюрьму. Церковь **Пьета** — при ней был сиротский приют, где больше тридцати лет преподавал музыку Антонио Вивальди; его девичий оркестр был знаменит на всю Европу.

        Совет: по пути три небольших моста со ступенями — идите не спеша. Цены в переулках за площадью заметно ниже, чем у Сан-Марко; выбирайте место с меню на итальянском. После обеда — 4 минуты назад к причалу San Zaccaria.
      en: |
        The "Quay of the Slavs": merchants from Dalmatia moored here — the "schiavoni", as Venetians called the Slavs from the eastern Adriatic shore. Today it's the city's grandest waterfront: the **Danieli** hotel in a 14th-century Gothic palace, and the view across the basin to San Giorgio Maggiore and Palladio's white church.

        From the **Ponte della Paglia** look at the **Bridge of Sighs**, which led the condemned from the palace to the prison. The **Pietà** church ran an orphanage where Antonio Vivaldi taught music for over thirty years; his all-girl orchestra was famous across Europe.

        Tip: there are three small stepped bridges on the way — take them slowly. Prices in the alleys behind the square are noticeably lower than around St Mark's; pick a place with an Italian menu. After lunch it's 4 minutes back to the San Zaccaria pier.

  - name: {en: "San Zaccaria — vaporetto 1 to Salute", ru: "Сан-Дзаккария — вапоретто № 1 до Салюте"}
    place: "45.43385,12.34230"
    lat: 45.43385
    lng: 12.34230
    walk_min: [4, 5]
    visit_min: [10, 15]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/07.mp3}
    short:
      ru: |
        С причала **San Zaccaria** — линия **1** в сторону **Piazzale Roma**, две остановки, около 7 минут, до **Salute**. Катер подходит к самым ступеням церкви.
      en: |
        From the **San Zaccaria** pier take line **1** towards **Piazzale Roma**, two stops, about 7 minutes, to **Salute**. The boat docks right by the church steps.
    long:
      ru: |
        Катер пересекает устье Гранд-канала: слева остаются Дворец дожей и Пьяцетта с двумя колоннами, справа — остров **Сан-Джорджо-Маджоре** с церковью Палладио и мыс Пунта-делла-Догана.

        Совет: у San Zaccaria несколько понтонов с буквами — на табло найдите тот, где написано «1 Piazzale Roma». Будьте у Салюте после 15:00, когда она открывается.
      en: |
        The boat crosses the mouth of the Grand Canal: the Doge's Palace and the Piazzetta with its two columns on the left, **San Giorgio Maggiore** with Palladio's church and the Punta della Dogana on the right.

        Tip: San Zaccaria has several lettered pontoons — find the one whose board says "1 Piazzale Roma". Aim to reach the Salute after 15:00, when it opens.

  - name: {en: Santa Maria della Salute, ru: Санта-Мария-делла-Салюте}
    place: "Basilica di Santa Maria della Salute, Venezia"
    lat: 45.43057
    lng: 12.33473
    walk_min: 2
    visit_min: [20, 30]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/08.mp3}
    short:
      ru: |
        Открыта 15:00–17:30, вход в храм бесплатный. Ризница с Тицианом и Тинторетто — около €4, до 17:00. Ступени церкви — хорошее место присесть.
      en: |
        Open 15:00–17:30, free entry to the church. The sacristy with Titian and Tintoretto costs about €4, until 17:00. The church steps are a good place to sit.
    long:
      ru: |
        Венецианский сенат дал обет построить эту церковь в 1630 году, во время чумы, унёсшей почти треть жителей города. Проект молодого Бальдассаре Лонгены строили больше полувека, до 1687 года; по преданию, под ней больше миллиона деревянных свай. Огромные волюты-«улитки» вокруг купола стали силуэтом, по которому Венецию узнают издалека.

        Что посмотреть: восьмиугольный зал, где пол из цветного мрамора сходится к центру концентрическими кругами; главный алтарь со скульптурой «Венеция на коленях перед Мадонной, изгоняющей чуму».

        Совет: со ступеней церкви — прекрасный вид на Гранд-канал и причалы Сан-Марко. Отсюда 3 минуты до мыса Пунта-делла-Догана.
      en: |
        The Venetian Senate vowed to build this church in 1630, during a plague that killed nearly a third of the city. Young Baldassare Longhena's design took more than half a century to build, until 1687; tradition says over a million wooden piles lie beneath it. The huge scroll buttresses round the dome became the silhouette that identifies Venice from afar.

        Look at the octagonal hall, where the coloured marble floor converges in concentric rings, and the high altar with its sculpture of Venice kneeling before the Virgin as she drives out the plague.

        Tip: the church steps give a lovely view of the Grand Canal and the San Marco piers. The Punta della Dogana is 3 minutes away.

  - name: {en: Punta della Dogana, ru: Пунта-делла-Догана}
    place: "Punta della Dogana, Venezia"
    lat: 45.43095
    lng: 12.33709
    walk_min: 3
    visit_min: [15, 20]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/09.mp3}
    short:
      ru: |
        Мыс между Гранд-каналом и каналом Джудекка — одна из лучших бесплатных смотровых точек города. Вдоль края — низкий каменный парапет, на нём можно сидеть.
      en: |
        The tip between the Grand Canal and the Giudecca Canal, one of the best free viewpoints in the city. A low stone parapet runs along the edge — you can sit on it.
    long:
      ru: |
        Здесь была морская таможня: каждый корабль, входивший в город, разгружался и платил пошлины. Над башней два атланта держат золотой шар, а на нём стоит фигура Фортуны, которая поворачивается по ветру: удача Венеции зависела от моря и ветров.

        Совет: встаньте на самом краю мыса — с одной стороны площадь Сан-Марко и Дворец дожей, прямо — Сан-Джорджо-Маджоре, справа — остров Джудекка. Отсюда — медленно на запад вдоль воды, по набережной Дзаттере, 8–10 минут.
      en: |
        This was the sea customs house: every ship entering the city unloaded and paid duty here. Above the tower two Atlases hold a golden globe topped by a figure of Fortune that turns with the wind: Venice's luck depended on the sea and the winds.

        Tip: stand at the very tip: St Mark's Square and the Doge's Palace on one side, San Giorgio Maggiore straight ahead, Giudecca island to the right. From here, walk slowly west along the water on the Zattere, 8–10 minutes.

  - name: {en: "The Zattere: sunset and a spritz", ru: "Дзаттере: закат и спритц"}
    place: "Fondamenta Zattere ai Gesuati, Venezia"
    lat: 45.42908
    lng: 12.32802
    radius_m: 300
    approach: [{name: Fondamenta Zattere ai Saloni, lat: 45.42857, lng: 12.33298}]
    walk_min: [8, 10]
    visit_min: [90, 120]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/10.mp3}
    short:
      ru: |
        Длинная солнечная набережная вдоль канала Джудекка. Мороженое в Gelateria Nico, кафе у воды до заката около 17:00 — солнце садится за Джудекку и порт. После заката — спритц и чиккетти в баре у воды, без брони.
      en: |
        A long sunny quay along the Giudecca Canal. Ice cream at Gelateria Nico and a waterside café until sunset around 17:00, behind Giudecca and the port. After sunset, a spritz and cicchetti at a bar by the water, no booking needed.
    long:
      ru: |
        «Дзаттере» значит «плоты»: сюда сплавляли лес с материка, и на этих брёвнах, по сути, стоит весь город. Набережная тянется почти на два километра и смотрит на юг, поэтому здесь светлее и теплее, чем в узких улочках, — любимое место венецианцев для вечерней прогулки.

        Что посмотреть: напротив, на Джудекке, — церковь **Иль-Реденторе** Палладио, автора Сан-Джорджо-Маджоре; вечером её подсвечивают. Рядом — церковь **Джезуати** с плафонами Тьеполо. По желанию, в 3 минутах дальше, — **скверо Сан-Тровазо**, старинная мастерская гондол в деревянном доме, похожем на альпийское шале.

        Совет: «джандуйотто» в **Gelateria Nico** — брикет шоколадно-орехового мороженого в сливках, местная классика. Венецианцы ужинают с 19:00; до этого — аперитив у воды, спритц или бокал вина, а к нему чиккетти — этого вполне хватит вместо ужина. Вечером с канала тянет холодом — пригодится тёплая кофта.
      en: |
        "Zattere" means "rafts": timber was floated here from the mainland, and the whole city effectively stands on those logs. The quay runs for almost two kilometres and faces south, so it's brighter and warmer than the narrow alleys — a favourite Venetian spot for an evening stroll.

        Opposite, on Giudecca, is **Il Redentore**, by Palladio, who also built San Giorgio Maggiore, floodlit in the evening. Nearby is the **Gesuati** church with ceilings by Tiepolo. Optionally, 3 minutes further on, is the **Squero di San Trovaso**, an old gondola yard in a wooden house like an Alpine chalet.

        Tip: a "gianduiotto" at **Gelateria Nico** is a slab of chocolate-hazelnut ice cream drowned in whipped cream, a local classic. Venetians dine from 19:00; until then, an aperitivo by the water, a spritz or a glass of wine, with cicchetti — plenty instead of dinner. The canal gets chilly in the evening, so a warm layer helps.

  - name: {en: "Zattere — vaporetto 2 to Piazzale Roma", ru: "Дзаттере — вапоретто № 2 до Пьяццале Рома"}
    place: "45.42950,12.32630"
    lat: 45.42950
    lng: 12.32630
    walk_min: 3
    visit_min: [15, 20]
    audio: {ru: audio/italy/07-venice-san-marco-dorsoduro/11.mp3}
    short:
      ru: |
        Финиш. С причала Zattere — линия **2** в сторону **Piazzale Roma** (через Сакка-Физола и Тронкетто), около 15 минут. Дальше автобус № 6 до Via Paleocapa, последние рейсы — 23:10, 23:25, 23:50.
      en: |
        Finish. From the Zattere pier take line **2** towards **Piazzale Roma** (via Sacca Fisola and Tronchetto), about 15 minutes. Then bus no. 6 to Via Paleocapa, last departures 23:10, 23:25, 23:50.
    long:
      ru: |
        Катер идёт по каналу Джудекка мимо огней набережных и порта — ни одного моста и ни одной ступеньки. Вечером он ходит реже, примерно раз в 20 минут; расписание — в приложении AVM Venezia.

        Совет: на табло проверьте направление — линия 2 идёт по кругу, и катер в другую сторону поплывёт к Сан-Марко.
      en: |
        The boat runs along the Giudecca Canal past the lights of the quays and the port — not a single bridge or step. In the evening it's less frequent, about every 20 minutes; check the AVM Venezia app.

        Tip: check the direction on the board — line 2 runs in a loop, and a boat the other way heads to San Marco.
