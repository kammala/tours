country: {en: Italy, ru: Италия}
city: {en: Venice, ru: Венеция}
name: {en: "Sat 31 Oct · San Michele, Murano, lunch on Burano and evening Cannaregio by boat", ru: "Сб, 31 окт · Сан-Микеле, Мурано, обед на Бурано и вечерний Каннареджо на катерах"}
place_suffix: Venezia
summary:
  ru: "≈ 3,5 км пешком, с 9:45 до вечера; около 2 часов на вапоретто — кладбище Сан-Микеле, Мурано, обед на Бурано в 14:30 и тихий Каннареджо"
  en: "≈ 3.5 km on foot, from 09:45 into the evening; about 2 hours on vaporetti — San Michele cemetery, Murano, lunch on Burano at 14:30 and quiet Cannaregio"
intro:
  ru: |
    Суббота, 31 октября. День островов, все вместе: подъём около 8:30, выход около **9:45**. С Пьяццале Рома вапоретто **4.2** без пересадки идёт до острова-кладбища **Сан-Микеле**, где похоронены Бродский, Стравинский и Дягилев, а оттуда одна остановка до **Мурано** — смотрим стекло, пока работают печи. Оттуда **№ 12** на **Бурано**: прогулка по цветным улицам и поздний обед в **Gatto Nero**. На закате — катером через лагуну обратно, и вечер в самом тихом районе Венеции, Каннареджо. Пешком сегодня немного: почти все переходы — на воде, сидя.

    **Время на воде.** Катера займут около двух часов (~30 минут до Сан-Микеле, 5 до Мурано, ~30 до Бурано, ~40 до Фондаменте-Нове, 5 до Мадонна-дель-Орто, ~10 вечером до Пьяццале Рома), плюс ожидание: осенью № 12 ходит примерно раз в 30 минут. Расписание проверяйте в приложении AVM Venezia или на табло.

    **Очереди.** № 12 приходит на Мурано-Фаро уже с пассажирами из Фондаменте-Нове. Около 12:50 обычно садимся спокойно, но если катер полный — следующий через полчаса, и к обеду вы всё равно успеваете. Обратно с Бурано самый наплыв — с 15:30 до 17:00; мы уезжаем после обеда, около 17:00, когда он спадает.

    **Обед на Бурано забронирован: 14:30, трое, дегустационное меню.** Бронь строго на троих — изменения только с согласия ресторана заранее. Дегустация займёт 2–2½ часа. Музей кружева открыт примерно до 16:00, так что успеть в него можно только до обеда. Закат около **17:00** — его послесвечение застанете на катере через лагуну. После такого обеда ужин не нужен: вечером в Каннареджо — прогулка, спритц и пара чикетти.
  en: |
    Saturday 31 October. Island day, all together: up around 08:30, out around **09:45**. From Piazzale Roma vaporetto **4.2** runs with no change to the cemetery island of **San Michele**, where Brodsky, Stravinsky and Diaghilev are buried, then one stop on to **Murano** — see the glass while the furnaces are going. From there **no. 12** to **Burano**: a stroll through the coloured streets and a late lunch at **Gatto Nero**. At sunset, back across the lagoon by boat, and the evening in the quietest district of Venice, Cannaregio. Little walking today: almost every leg is on the water, sitting down.

    **Time on the water.** The boats take about two hours (~30 minutes to San Michele, 5 to Murano, ~30 to Burano, ~40 to Fondamente Nove, 5 to Madonna dell'Orto, ~10 to Piazzale Roma in the evening), plus waiting: in autumn no. 12 runs only about every 30 minutes. Check times in the AVM Venezia app or on the boards.

    **Queues.** No. 12 reaches Murano Faro already carrying passengers from Fondamente Nove. Around 12:50 you'll usually get on fine, but if it's full the next one is half an hour later and you still make lunch. Coming back from Burano, the rush is 15:30–17:00; you leave after lunch, around 17:00, as it eases.

    **Lunch on Burano is booked: 14:30, three people, tasting menu.** The booking is binding for three — any change needs the restaurant's OK in advance. The tasting menu takes 2–2½ hours. The Lace Museum is open until about 16:00, so it only fits before lunch. Sunset is around **17:00** — you'll catch the afterglow on the boat across the lagoon. After a lunch like that nobody needs dinner: the Cannaregio evening is a stroll, a spritz and a few cicchetti.
outro:
  ru: |
    Обратно — автобус № 6 с Пьяццале Рома до Via Paleocapa; последние рейсы — в 23:10, 23:25 и 23:50.

    Завтра, в воскресенье 1 ноября (День всех святых, в Италии выходной), — выезд из кемпинга и дорога в **Верону**: около 120 км и **1,5 часа** по A4. После Вероны — **Сирмионе** на озере Гарда.
  en: |
    Head back on bus no. 6 from Piazzale Roma to Via Paleocapa; the last departures are at 23:10, 23:25 and 23:50.

    Tomorrow, Sunday 1 November (All Saints' Day, a public holiday in Italy), check out of the campsite and drive to **Verona**: about 120 km and **1.5 hours** on the A4. After Verona, on to **Sirmione** on Lake Garda.
points:
  - name: {en: hu Venezia camping in town, ru: Кемпинг hu Venezia camping in town}
    place: "hu Venezia camping in town, Via Giuseppe De Marchi 7, Marghera"
    lat: 45.47240
    lng: 12.21200
    radius_m: 250
    short:
      ru: |
        Старт около 9:45. До остановки автобуса 12–15 минут пешком через подземный переход.
      en: |
        Start around 09:45. The bus stop is 12–15 minutes' walk through the underpass.
    long:
      ru: |
        Путь до остановки тот же, что в предыдущие дни: велодорожка вдоль Via De Marchi, подземный переход, Via della Fonte, налево по Via Cesare Beccaria до Via Paleocapa.

        Совет: на лагуне ветрено и холоднее, чем в городе, — возьмите тёплую куртку и шапку, даже если утро солнечное. Вернёмся уже в темноте. Пригодится и бутылка воды: на причалах купить её негде.
      en: |
        Same way to the stop as on the previous days: the cycle path along Via De Marchi, the underpass, Via della Fonte, then left up Via Cesare Beccaria to Via Paleocapa.

        Tip: the lagoon is windier and colder than the city, so bring a warm jacket and a hat even if the morning is sunny — you'll be coming back after dark. A bottle of water helps too: there's nowhere to buy one on the piers.

