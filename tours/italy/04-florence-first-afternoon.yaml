        Пешком до дома около 35 минут вдоль реки — после такого дня лучше ехать. В автобусе каждый прикладывает свою бесконтактную карту к валидатору у двери: билет на 90 минут, около 2 €.

        Совет: на площади Ферруччи есть продуктовые магазины и пекарня — удобно купить что-то к завтраку, ведь завтра выходить рано.
