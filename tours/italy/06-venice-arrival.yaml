country: {en: Italy, ru: Италия}
city: {en: Venice, ru: Венеция}
name: {en: "Thu 29 Oct · Arrival evening: Rialto, the Grand Canal and St Mark's", ru: "Чт, 29 окт · Вечер приезда: Риальто, Гранд-канал и Сан-Марко"}
place_suffix: Venezia
summary:
  ru: "≈ 5 км пешком, 6–7 часов с дорогой; автобус до Пьяццале Рома и 20 минут на вапоретто по Гранд-каналу"
  en: "≈ 5 km on foot, 6–7 hours including the bus; one 20-minute vaporetto ride down the Grand Canal"
intro:
  ru: |
    Четверг, 29 октября. Утром — дорога из Флоренции в Маргеру: около 260 км и **3 часа** по A1 через Апеннины, затем A13 через Болонью и Падую. В навигатор — **hu Venezia camping in town, Via Giuseppe De Marchi 7, Marghera**; кемпинг стоит прямо у развязки Тангенциале ди Местре. Парковка на территории кемпинга бесплатная — машина остаётся там до воскресенья.

    **Как добираться в город.** Основной вариант — автобус ACTV **№ 6** от остановки на Via Paleocapa (12–15 минут пешком от кемпинга) до Пьяццале Рома, около 10–15 минут. От Пьяццале Рома он уходит каждые 20 минут, в :10, :30 и :50; по данным кемпинга, последние рейсы — **23:10, 23:25 и 23:50**. У кемпинга есть и свой шаттл (€2,50, ~15 минут до Tronchetto, оттуда одна остановка на People Mover до Пьяццале Рома), но расписание не публикуется, а в одном из описаний указаны только рейсы в 10:00 туда и в 18:00 обратно — нам это не подходит. Уточните на ресепшене.

    **Билеты.** Возьмите каждому туристический проездной ACTV на **72 часа (€45)**: он действует на автобусах Местре и Маргеры, на всех вапоретто (кроме Alilaguna и автобусов в аэропорт) и на People Mover. Если активировать его сегодня около 14:30, он проработает до воскресенья 14:30 и покроет все три дня. Для сравнения: разовый билет на вапоретто стоит €9,50 (75 минут), автобусный — €1,50; за три дня набирается 6–7 поездок на воде, так что проездной окупается с запасом. Купить его можно в приложении **AVM Venezia** (QR-код прикладывают к валидатору) или в кассах и автоматах Venezia Unica на Пьяццале Рома — но тогда на первый автобус нужен разовый билет из табачной лавки.

    **Сбор за вход в Венецию** (contributo di accesso) в 2026 году взимается только в 60 «пиковых» дней с 3 апреля по 26 июля, с 8:30 до 16:00. В октябре его нет, платить и регистрироваться не нужно. К тому же гости, ночующие в коммуне Венеция, к которой относится и Маргера, от сбора освобождены в любом случае.

    Закат сегодня около **17:00**: после перевода часов 25 октября темнеет рано, поэтому маршрут построен так, чтобы к закату вы уже плыли по Гранд-каналу.
  en: |
    Thursday 29 October. In the morning, drive from Florence to Marghera: about 260 km and **3 hours** on the A1 over the Apennines, then the A13 via Bologna and Padua. Set the satnav to **hu Venezia camping in town, Via Giuseppe De Marchi 7, Marghera**; the campsite sits right by the Tangenziale di Mestre interchange. Parking inside the campsite is free, and the car stays there until Sunday.

    **Getting into the city.** The main option is ACTV bus **no. 6** from the Via Paleocapa stop (12–15 minutes' walk from the campsite) to Piazzale Roma, about 10–15 minutes. From Piazzale Roma it leaves every 20 minutes, at :10, :30 and :50; according to the campsite, the last departures are **23:10, 23:25 and 23:50**. The campsite also runs its own shuttle (€2.50, ~15 minutes to Tronchetto, then one stop on the People Mover to Piazzale Roma), but its timetable isn't published, and one listing shows only a 10:00 run out and an 18:00 run back, which doesn't fit these days. Ask at reception.

    **Tickets.** Get everyone an ACTV **72-hour** tourist travel card (**€45**): it covers the buses in Mestre and Marghera, every vaporetto (except Alilaguna and the airport buses) and the People Mover. Validated today around 14:30, it runs until 14:30 on Sunday and covers all three days. For comparison, a single vaporetto ticket costs €9.50 (75 minutes) and a bus ticket €1.50; the three days add up to 6–7 boat rides, so the pass pays for itself easily. Buy it in the **AVM Venezia** app (you hold the QR code to the validator) or at the Venezia Unica desks and machines at Piazzale Roma — in that case you need a single ticket from a tobacconist for the first bus.

    **The Venice access fee** (contributo di accesso) in 2026 applies only on 60 peak days between 3 April and 26 July, 08:30–16:00. There is none in October, so there is nothing to pay or register. Guests staying overnight in the municipality of Venice, which includes Marghera, are exempt anyway.

    Sunset today is around **17:00**: the clocks went back on 25 October and it gets dark early, so the route has you on the Grand Canal by sunset.
outro:
  ru: |
    Обратно — автобус № 6 с Пьяццале Рома; выходите на **Via Paleocapa** (попросите водителя подсказать) и идите к кемпингу тем же путём через подземный переход. Последние рейсы — в 23:10, 23:25 и 23:50.

    Завтра ранний старт: Дворец дожей открывается в 9:00, так что из кемпинга лучше выйти около 7:30.
  en: |
    Head back on bus no. 6 from Piazzale Roma; get off at **Via Paleocapa** (ask the driver) and walk to the campsite the same way, through the underpass. The last departures are at 23:10, 23:25 and 23:50.

    Tomorrow starts early: the Doge's Palace opens at 09:00, so leave the campsite around 07:30.
points:
  - name: {en: hu Venezia camping in town, ru: Кемпинг hu Venezia camping in town}
    place: "hu Venezia camping in town, Via Giuseppe De Marchi 7, Marghera"
    lat: 45.47240
    lng: 12.21200
    radius_m: 250
    short:
      ru: |
        Старт. Заселение и парковка на территории кемпинга (бесплатно). Отсюда 12–15 минут пешком до автобуса № 6.
      en: |
        Start. Check in and park inside the campsite (free). From here it's 12–15 minutes' walk to bus no. 6.
    long:
      ru: |
        Кемпинг-деревня с домиками и глэмпингом на окраине Маргеры — материковой части коммуны Венеция. Сама Маргера выросла в 1920-х годах как «город-сад» для рабочих нового промышленного порта Порто-Маргера: отсюда низкая застройка, зелёные улицы и широкие проспекты, совсем не похожие на исторический центр в восьми километрах отсюда.

        До автобуса идём на восток: вдоль Via De Marchi по велодорожке, через **подземный переход** под съездом с развязки, затем по Via della Fonte мимо спортивного центра и налево по Via Cesare Beccaria до Via Paleocapa.

        Совет: на ресепшене спросите про шаттл в Венецию (€2,50) — вдруг осенью у него удобное расписание. Там же можно уточнить, где ближайшая табачная лавка (tabacchi) с автобусными билетами, если проездной ещё не куплен.
      en: |
        A campsite village with cabins and glamping tents on the edge of Marghera, the mainland part of the municipality of Venice. Marghera itself grew up in the 1920s as a "garden city" for workers at the new industrial port of Porto Marghera, hence the low-rise housing, leafy streets and broad avenues, nothing like the historic centre eight kilometres away.

        To the bus, head east: along Via De Marchi on the cycle path, through the **underpass** beneath the interchange ramp, then along Via della Fonte past the sports centre and left up Via Cesare Beccaria to Via Paleocapa.

        Tip: ask reception about the shuttle to Venice (€2.50) in case its autumn timetable suits you. They can also point you to the nearest tobacconist (tabacchi) for bus tickets if you haven't bought the pass yet.

  - name: {en: "Bus stop Paleocapa (line 6)", ru: "Остановка Paleocapa (автобус № 6)"}
    place: "45.47691,12.22017"
    lat: 45.47691
    lng: 12.22017
    approach:
      - {name: Underpass, lat: 45.47117, lng: 12.21330}
      - {name: Via della Fonte, lat: 45.47340, lng: 12.21600}
      - {name: Via Cesare Beccaria, lat: 45.47427, lng: 12.21929}
    walk_min: [12, 15]
    short:
      ru: |
        Автобус № 6 в сторону Venezia (Пьяццале Рома), каждые ~20 минут, ехать 10–15 минут. Сразу при входе приложите проездной или билет к валидатору.
      en: |
        Bus no. 6 towards Venezia (Piazzale Roma), every ~20 minutes, a 10–15-minute ride. Tap your pass or ticket on the validator as soon as you board.
    long:
      ru: |
        Остановка на Via Paleocapa — по направлению к Венеции (не перепутайте сторону улицы). Через несколько минут автобус выезжает на **мост Свободы** (Ponte della Libertà) — почти четыре километра над лагуной. Его открыли в 1933 году под именем «мост Литторио», а нынешнее название он получил после войны. Рядом идёт железнодорожный мост 1846 года — до него Венеция была связана с материком только водой.

        Совет: садитесь у окна — с моста видна лагуна с одной стороны и порт с другой, а впереди вырастают колокольни. Если проездной куплен в приложении AVM Venezia, нажмите на валидаторе кнопку сканирования QR-кода и поднесите телефон.
      en: |
        The stop is on Via Paleocapa, on the side heading towards Venice (check you're on the right side of the street). A few minutes later the bus rolls onto the **Ponte della Libertà**, almost four kilometres across the lagoon. It opened in 1933 as the Ponte Littorio and got its present name after the war. Alongside runs the 1846 railway bridge; before it, Venice was connected to the mainland only by water.

        Tip: take a window seat. From the bridge you see the lagoon on one side and the port on the other, with bell towers rising ahead. If your pass is in the AVM Venezia app, press the QR scan button on the validator and hold up your phone.

  - name: {en: Piazzale Roma, ru: Пьяццале Рома}
    place: "Piazzale Roma, Venezia"
    lat: 45.43801
    lng: 12.31885
    radius_m: 250
    visit_min: 10
    short:
      ru: |
        Выход из автобуса. Если проездного ещё нет — купите его в кассе Venezia Unica здесь же. Запомните, откуда отходит № 6: вечером возвращаться сюда.
      en: |
        Get off here. If you don't have the pass yet, buy it at the Venezia Unica desk right here. Note where bus no. 6 leaves from: you'll be back here tonight.
    long:
      ru: |
        Площадь построили в 1930-х вместе с мостом Свободы как конечную точку дороги с материка: дальше машины не идут, начинается город, где всё возят по воде и носят на руках. Здесь автобусный вокзал, многоэтажные парковки и причалы вапоретто.

        Рядом, через Гранд-канал к вокзалу Санта-Лючия, перекинут **мост Конституции** (2008) испанского архитектора Сантьяго Калатравы — первый новый мост через Гранд-канал за семьдесят лет. Его стеклянные ступени красивы, но скользки в дождь.

        Совет: здесь есть платные туалеты — в самом городе их немного, так что лучше воспользоваться. Дальше начинается пешая часть: держите курс на жёлтые указатели «Per Rialto».
      en: |
        The square was built in the 1930s together with the Ponte della Libertà as the end of the road from the mainland: cars go no further, and beyond lies a city where everything travels by water or by hand. Here are the bus station, multi-storey car parks and vaporetto stops.

        Next to it, across the Grand Canal to Santa Lucia station, runs the **Ponte della Costituzione** (2008) by the Spanish architect Santiago Calatrava, the first new bridge over the Grand Canal in seventy years. Its glass steps are beautiful but slippery in the rain.

        Tip: there are paid toilets here, and there aren't many in the city, so use them. From here you walk: follow the yellow "Per Rialto" signs.

  - name: {en: Campo San Giacomo dall'Orio, ru: Кампо Сан-Джакомо-дель-Орио}
    place: "Campo San Giacomo dall'Orio, Venezia"
    lat: 45.44004
    lng: 12.32756
    approach:
      - {name: Giardini Papadopoli, lat: 45.43846, lng: 12.32072}
      - {name: Fondamenta Rio Marin, lat: 45.43950, lng: 12.32491}
      - {name: Ruga Bella, lat: 45.43999, lng: 12.32650}
    walk_min: [15, 20]
    visit_min: [10, 15]
    short:
      ru: |
        Первая венецианская площадь — тихая, жилая, с деревьями и скамейками. Короткая передышка и, если хочется, кофе.
      en: |
        Your first Venetian square: quiet and residential, with trees and benches. A short break and a coffee if you like.
    long:
      ru: |
        По пути — сад **Пападополи**, разбитый в XIX веке на месте снесённого монастыря, и канал **Рио-Марин** с одной из самых красивых набережных района Санта-Кроче. Здесь уже нет туристических толп: бельё на верёвках, лодки у дверей, местные с собаками.

        **Сан-Джакомо-дель-Орио** — одна из старейших церквей города: её основали ещё в IX–X веках, а нынешнее здание с романской колокольней — XIII века. Внутри — редкий деревянный потолок в форме корабельного киля, сделанный корабелами Арсенала. Название, по одной из версий, происходит от лавра (*alloro*), который рос на площади.

        Совет: кампо — излюбленное место местных семей; вечером здесь играют дети, а в барах по краям площади можно взять бокал вина или спритц по городским, а не туристическим ценам.
      en: |
        On the way you pass the **Giardini Papadopoli**, laid out in the 19th century on the site of a demolished monastery, and the **Rio Marin**, one of the prettiest canals in Santa Croce. The crowds are gone here: washing on lines, boats by the doors, locals walking their dogs.

        **San Giacomo dall'Orio** is one of the oldest churches in the city: it was founded in the 9th or 10th century, and the present building with its Romanesque bell tower dates from the 13th. Inside is a rare wooden ceiling shaped like an upturned ship's keel, built by shipwrights from the Arsenale. One theory says the name comes from a laurel tree (*alloro*) that grew on the square.

        Tip: the campo is a favourite with local families; in the evening children play here, and the bars around the edge serve a glass of wine or a spritz at local rather than tourist prices.

  - name: {en: Rialto Market, ru: Рынок Риальто}
    place: "Mercato di Rialto, Venezia"
    lat: 45.43964
    lng: 12.33452
    approach: ["Campo Santa Maria Mater Domini", "Campo San Cassiano"]
    walk_min: [10, 12]
    visit_min: 10
    short:
      ru: |
        Рыбный и овощной рынок у Гранд-канала. Торговля идёт по утрам со вторника по субботу, днём остаются пустые лоджии — но на них стоит посмотреть.
      en: |
        The fish and produce market on the Grand Canal. Trading happens in the mornings, Tuesday to Saturday; by afternoon only the empty loggias remain, but they're worth a look.
    long:
      ru: |
        Риальто — самое старое место города: здесь, на «высоком берегу» (*rivo alto*), в IX веке поселились первые венецианцы, и отсюда же управляли торговлей всей республики. Рынок работает на этом месте почти тысячу лет. **Пескерия** — рыбный павильон в неоготическом стиле — построена в 1907 году; на капителях её колонн вырезаны рыбы, крабы и лодки.

        Что посмотреть: павильон Пескерии с видом на Гранд-канал, овощные ряды Эрберии и старые таблички с минимальными размерами рыб, разрешёнными к продаже, — их вешала ещё республика.

        Совет: в субботу утром рынок самый живой — если будет возможность, загляните сюда в другой день до полудня. А пока обратите внимание на окрестные бакари: вечером мы вернёмся сюда за чиккетти.
      en: |
        The Rialto is the oldest part of the city: on this "high bank" (*rivo alto*) the first Venetians settled in the 9th century, and from here the trade of the whole Republic was run. A market has stood on this spot for almost a thousand years. The **Pescheria**, the neo-Gothic fish hall, was built in 1907; its capitals are carved with fish, crabs and boats.

        Look at the Pescheria hall with its Grand Canal view, the produce stalls of the Erberia, and the old plaques listing the minimum size of fish allowed for sale, put up by the Republic itself.

        Tip: Saturday morning is the liveliest time; if you can, come back on another day before noon. For now, note the bacari around here: we come back for cicchetti in the evening.

  - name: {en: Rialto Bridge, ru: Мост Риальто}
    place: "Ponte di Rialto, Venezia"
    lat: 45.43800
    lng: 12.33590
    approach: [{name: Ruga dei Oresi, lat: 45.43861, lng: 12.33510}]
    walk_min: 3
    visit_min: [10, 15]
    short:
      ru: |
        Перейдите мост на сторону Сан-Марко. Лучший вид на Гранд-канал — с внешних балюстрад моста, а не из торговой галереи посередине.
      en: |
        Cross the bridge to the San Marco side. The best Grand Canal views are from the outer balustrades, not from the shopping arcade in the middle.
    long:
      ru: |
        До XIX века это был единственный мост через Гранд-канал. Деревянные мосты на этом месте несколько раз горели и рушились — один обвалился в 1444 году под толпой, смотревшей свадебную процессию. Каменный мост Антонио да Понте построили в 1588–1591 годах; в конкурсе на проект проиграл сам Микеланджело. Одна арка длиной 28 метров была смелым инженерным решением, и скептики предрекали мосту скорое падение.

        Что посмотреть: два ряда лавок под арками, вид на юг — к изгибу канала у Ка-Фоскари — и на север, к палаццо Ка-д’Оро. Внизу, у набережной Рива-дель-Вин, когда-то выгружали вино, а напротив, на Рива-дель-Карбон, — уголь.

        Совет: на самом мосту всегда толпа; для фото отойдите на набережные по обе стороны, оттуда мост виден целиком. После моста поверните направо по Рива-дель-Карбон к причалу вапоретто.
      en: |
        Until the 19th century this was the only bridge over the Grand Canal. The wooden bridges here burned and collapsed several times; one gave way in 1444 under a crowd watching a wedding procession. Antonio da Ponte's stone bridge was built in 1588–1591; Michelangelo himself was among the losing entrants for the design. A single 28-metre arch was a bold piece of engineering, and sceptics predicted it would soon fall.

        Look at the two rows of shops under the arches, the view south to the bend of the canal at Ca' Foscari, and north towards the Ca' d'Oro. Below, along the Riva del Vin, wine used to be unloaded, and opposite, on the Riva del Carbon, coal.

        Tip: the bridge itself is always crowded; for photos step down to the quays on either side, where you see the whole span. After crossing, turn right along the Riva del Carbon to the vaporetto stop.

  - name: {en: "Grand Canal by vaporetto 1", ru: "Гранд-канал на вапоретто № 1"}
    place: "45.43750,12.33545"
    lat: 45.43750
    lng: 12.33545
    walk_min: 2
    visit_min: 20
    short:
      ru: |
        Причал Rialto на стороне Сан-Марко. Линия **1 в сторону Lido** до остановки **San Marco Vallaresso**, около 20 минут — как раз на закате. Проверьте на табло, что катер идёт на Lido, а не на Piazzale Roma.
      en: |
        The Rialto stop on the San Marco side. Take **line 1 towards Lido** to **San Marco Vallaresso**, about 20 minutes — right at sunset. Check the board says Lido, not Piazzale Roma.
    long:
      ru: |
        Пешком вдоль Гранд-канала не пройти — набережной у него почти нет, дворцы стоят прямо в воде. Поэтому этот отрезок проплываем на медленной линии 1, которая останавливается у каждого причала: лучшая и самая дешёвая экскурсия по городу.

        Что посмотреть: слева — **Палаццо Гримани**, палаццо Мочениго, где жил Байрон, **Палаццо Грасси** и **Палаццо Гритти**. Справа — **Ка-Фоскари** на самом изгибе канала (сейчас университет), **Ка-Реццонико**, музей XVIII века, и коллекция Пегги Гуггенхайм в недостроенном белом палаццо. Посередине пути — деревянный **мост Академии**, а в конце открывается купол **Санта-Мария-делла-Салюте** и вход в бассейн Сан-Марко.

        Совет: займите место на открытой палубе на носу или корме — внутри видно мало. Солнце садится около 17:00, и последние лучи ложатся на фасады правого берега.
      en: |
        You can't walk along the Grand Canal: it has almost no quay, and the palaces stand right in the water. So this stretch is done on the slow line 1, which calls at every stop — the best and cheapest tour in town.

        On the left you pass **Palazzo Grimani**, Palazzo Mocenigo, where Byron lived, **Palazzo Grassi** and the **Palazzo Gritti**. On the right are **Ca' Foscari** on the bend of the canal (now the university), **Ca' Rezzonico**, the museum of the 18th century, and the Peggy Guggenheim Collection in its unfinished white palazzo. Halfway along is the wooden **Accademia Bridge**, and at the end the dome of **Santa Maria della Salute** and the mouth of the St Mark's Basin open up.

        Tip: get a spot on the open deck at the bow or stern; inside you see very little. The sun sets around 17:00, and the last light falls on the façades on the right bank.

  - name: {en: "St Mark's Square at dusk", ru: "Площадь Сан-Марко в сумерках"}
    place: "Piazza San Marco, Venezia"
    lat: 45.43410
    lng: 12.33840
    radius_m: 250
    inside:
      - {name: Piazzetta San Marco, lat: 45.43355, lng: 12.33985}
      - {name: Ponte della Paglia, lat: 45.43365, lng: 12.34101}
      - {name: Torre dell'Orologio, lat: 45.43474, lng: 12.33893}
    walk_min: 3
    visit_min: [40, 60]
    short:
      ru: |
        От причала Vallaresso — 3 минуты. Сегодня только снаружи: площадь, Пьяцетта, вид на Мост вздохов с моста Палья. Внутрь — завтра, по брони.
      en: |
        3 minutes from the Vallaresso stop. Exteriors only today: the square, the Piazzetta, and the Bridge of Sighs from the Ponte della Paglia. Inside tomorrow, with bookings.
    long:
      ru: |
        Наполеону приписывают слова о «самой элегантной гостиной Европы». Площадь окружают **Прокурации** — длинные аркады, где жили и работали прокураторы Сан-Марко, высшие после дожа сановники республики. На востоке — **собор Святого Марка** с золотыми мозаиками на фасаде, рядом — **Дворец дожей**. Колокольня высотой 98,6 метра выглядит древней, но это копия: оригинал внезапно рухнул 14 июля 1902 года, и к 1912-му её восстановили «где была и какой была».

        Что посмотреть: на **Пьяцетте** — две колонны со львом Святого Марка и Святым Теодором: между ними когда-то казнили преступников, поэтому суеверные венецианцы до сих пор там не ходят. С **моста Палья** — классический вид на **Мост вздохов**, по которому вели заключённых из дворца в тюрьму. **Часовая башня** конца XV века с двумя бронзовыми «маврами», отбивающими часы, ведёт в Мерчерие — дальше пойдём под её аркой.

        Совет: при желании поднимитесь на колокольню — до 31 октября она открыта примерно до 20:45 (билет около €15, лучше купить онлайн на сайте собора); огни города с высоты стоят того. Кафе **Florian** (1720) и **Quadri** — самые старые в городе; кофе за столиком на площади, особенно под музыку оркестра, стоит очень дорого, у стойки внутри — гораздо дешевле. В сезон большой воды (октябрь–январь) площадь — самое низкое место города; барьеры MOSE защищают от сильных приливов, но лужи всё равно бывают.
      en: |
        Napoleon is credited with calling it "the most elegant drawing room in Europe". The square is lined by the **Procuratie**, long arcades where the Procurators of St Mark, the Republic's highest officials after the Doge, lived and worked. To the east stand **St Mark's Basilica** with its golden façade mosaics and the **Doge's Palace**. The 98.6-metre bell tower looks ancient, but it's a copy: the original suddenly collapsed on 14 July 1902 and was rebuilt by 1912 "where it was and as it was".

        On the **Piazzetta** stand two columns with the Lion of St Mark and St Theodore; criminals were once executed between them, so superstitious Venetians still won't walk there. From the **Ponte della Paglia** you get the classic view of the **Bridge of Sighs**, which led prisoners from the palace to the jail. The late-15th-century **Clock Tower**, with two bronze "Moors" striking the hours, leads into the Mercerie; we leave through its archway.

        Tip: if you like, go up the bell tower — until 31 October it's open until about 20:45 (a ticket is around €15, best bought online on the basilica's website); the city lights from the top are worth it. **Florian** (1720) and **Quadri** are the oldest cafés in town; coffee at a table on the square, especially with the orchestra playing, is very expensive, while at the bar inside it costs far less. In the high-water season (October–January) the square is the lowest point in the city; the MOSE barriers hold back the big tides, but puddles still happen.

  - name: {en: Cicchetti by the Rialto, ru: Чиккетти у Риальто}
    place: "Ruga dei Oresi, Venezia"
    lat: 45.43861
    lng: 12.33510
    approach:
      - {name: Marzaria San Salvador, lat: 45.43680, lng: 12.33686}
      - {name: Campo San Bartolomeo, lat: 45.43767, lng: 12.33681}
      - {name: Ponte di Rialto, lat: 45.43800, lng: 12.33590}
    walk_min: 15
    visit_min: [45, 75]
    short:
      ru: |
        Через Мерчерие обратно к Риальто и через мост в Сан-Поло. Ужин по-венециански: обход нескольких бакари с чиккетти и бокалом вина (*ombra*) у стойки.
      en: |
        Through the Mercerie back to the Rialto and over the bridge into San Polo. Dinner Venetian-style: a crawl round a few bacari with cicchetti and a glass of wine (*ombra*) at the counter.
    long:
      ru: |
        **Мерчерие** — цепочка торговых улиц от Часовой башни до Риальто, главный торговый путь средневекового города. По пути — кампо Сан-Сальвадор и кампо Сан-Бартоломео с памятником драматургу Карло Гольдони.

        **Бакаро** — венецианский винный бар, где едят стоя: небольшие закуски-**чиккетти** на кусочках хлеба или поленты — треска-баккала мантекато, сарде ин саор (сардины в маринаде с луком), фрикадельки-польпетте — и маленький бокал вина, по-местному «омбра» («тень»: торговцы вином когда-то прятались с бочками в тени колокольни). Вокруг рынка Риальто, на Руга-деи-Орези и в соседних переулках, они стоят один за другим; среди самых известных — **Cantina Do Mori**, которая ведёт историю с XV века.

        Совет: чиккетти стоят по €2–4, заказывают их у стойки, указывая пальцем. Многие бакари закрываются рано — к 20:00–21:00, — поэтому лучше начать около 18:30. Если хочется сесть, ищите вывеску «osteria» или «trattoria».
      en: |
        The **Mercerie** are the chain of shopping streets from the Clock Tower to the Rialto, the main commercial artery of the medieval city. On the way you pass Campo San Salvador and Campo San Bartolomeo with its statue of the playwright Carlo Goldoni.

        A **bacaro** is a Venetian wine bar where you eat standing up: small **cicchetti** on bread or polenta — baccalà mantecato (whipped salt cod), sarde in saor (sardines marinated with onions), polpette meatballs — and a small glass of wine, locally an "ombra" ("shade": wine sellers once kept their barrels in the shade of the bell tower). Around the Rialto market, on Ruga dei Oresi and the alleys nearby, they stand one after another; among the best known is **Cantina Do Mori**, which traces its history to the 15th century.

        Tip: cicchetti cost €2–4 each; order at the counter by pointing. Many bacari close early, around 20:00–21:00, so start around 18:30. If you'd rather sit down, look for a sign saying "osteria" or "trattoria".

  - name: {en: Campo San Polo, ru: Кампо Сан-Поло}
    place: "Campo San Polo, Venezia"
    lat: 45.43740
    lng: 12.33000
    approach: ["Campo Sant'Aponal"]
    walk_min: [7, 10]
    visit_min: 10
    short:
      ru: |
        Вторая по величине площадь Венеции после Сан-Марко — и вечером почти пустая. Отсюда начинается тихий Сан-Поло.
      en: |
        The second-largest square in Venice after St Mark's, and almost empty in the evening. Quiet San Polo starts here.
    long:
      ru: |
        Огромное кампо в форме амфитеатра: изогнутый ряд палаццо повторяет русло засыпанного канала. Здесь устраивали бои быков, балы и ярмарки, проповедовали, а летом сейчас показывают кино под открытым небом. В 1548 году здесь же был убит Лоренцино Медичи, бежавший из Флоренции после убийства своего кузена, герцога Алессандро.

        Что посмотреть: церковь Сан-Поло с отдельно стоящей колокольней — у её основания два романских льва, один держит змею, другой — человеческую голову. Внутри церкви — цикл «Крестный путь» Джандоменико Тьеполо, но вечером она, скорее всего, уже закрыта.

        Совет: если после бакари хочется посидеть с десертом или вином — по краям кампо есть несколько баров, и здесь гораздо спокойнее, чем у Риальто.
      en: |
        A huge amphitheatre-shaped campo: the curved row of palaces follows the line of a filled-in canal. It has hosted bullfights, balls, fairs and sermons, and in summer there's open-air cinema now. In 1548 Lorenzino de' Medici, who had fled Florence after murdering his cousin Duke Alessandro, was killed here.

        Look at the church of San Polo with its free-standing bell tower: at its base are two Romanesque lions, one holding a snake, the other a human head. Inside are Giandomenico Tiepolo's Stations of the Cross, though in the evening the church is most likely shut.

        Tip: if you want to sit down with dessert or a glass of wine after the bacari, there are a few bars around the campo, much calmer than at the Rialto.

  - name: {en: "The Frari and San Rocco", ru: "Фрари и Сан-Рокко"}
    place: "Basilica dei Frari, Venezia"
    lat: 45.43687
    lng: 12.32623
    inside: [{name: Scuola Grande di San Rocco, lat: 45.43654, lng: 12.32527}]
    walk_min: [7, 10]
    visit_min: [10, 15]
    short:
      ru: |
        Вечерняя прогулка мимо двух главных сокровищниц района — снаружи. Обе закрываются в 17:30–18:00; внутрь стоит вернуться в другой день, если останется время.
      en: |
        An evening stroll past the district's two great treasure houses, from outside. Both close at 17:30–18:00; come back another day if you have time.
    long:
      ru: |
        **Санта-Мария-Глориоза-деи-Фрари** — огромная францисканская церковь из красного кирпича XIV–XV веков. Внутри — «Вознесение Девы Марии» Тициана над главным алтарём, самая большая алтарная картина Венеции, и гробница самого Тициана, умершего от чумы в 1576 году. Колокольня Фрари — вторая по высоте в городе после Сан-Марко.

        За церковью — **Скуола-Гранде-ди-Сан-Рокко**, здание благотворительного братства, которое больше двадцати лет расписывал Тинторетто: более пятидесяти полотен, и его называют «Сикстинской капеллой Венеции».

        Совет: вечером переулки Сан-Поло пустеют, и это лучший момент почувствовать город без толп. От Сан-Рокко до Пьяццале Рома — около 12 минут, указатели «Piazzale Roma» на стенах домов.
      en: |
        **Santa Maria Gloriosa dei Frari** is a vast 14th–15th-century Franciscan church in red brick. Inside are Titian's "Assumption of the Virgin" over the high altar, the largest altarpiece in Venice, and the tomb of Titian himself, who died of plague in 1576. The Frari bell tower is the second tallest in the city after St Mark's.

        Behind the church is the **Scuola Grande di San Rocco**, the hall of a charitable confraternity that Tintoretto spent more than twenty years decorating: over fifty canvases, earning it the name "the Sistine Chapel of Venice".

        Tip: in the evening the San Polo alleys empty out, and it's the best moment to feel the city without crowds. From San Rocco to Piazzale Roma is about 12 minutes; follow the "Piazzale Roma" signs on the walls.

  - name: {en: Piazzale Roma, ru: Пьяццале Рома}
    place: "Piazzale Roma, Venezia"
    lat: 45.43801
    lng: 12.31885
    radius_m: 250
    approach: [{name: Campo dei Tolentini, lat: 45.43765, lng: 12.32143}]
    walk_min: 12
    short:
      ru: |
        Финиш. Автобус № 6 в сторону Marghera/Spinea, выход на Via Paleocapa. Отправления в :10, :30 и :50, последние — 23:10, 23:25, 23:50.
      en: |
        Finish. Bus no. 6 towards Marghera/Spinea, get off at Via Paleocapa. Departures at :10, :30 and :50; the last ones at 23:10, 23:25 and 23:50.
    long:
      ru: |
        По пути — кампо деи Толентини с церковью Сан-Никола-да-Толентино и её классическим портиком; рядом — здание архитектурного университета IUAV с воротами работы Карло Скарпы.

        Совет: автобус № 6 отходит с пронумерованных платформ автовокзала — номер платформы виден на табло. Не забудьте приложить проездной к валидатору и на обратном пути.
      en: |
        On the way is Campo dei Tolentini with the church of San Nicola da Tolentino and its classical portico; next to it is the IUAV architecture university, with an entrance gate by Carlo Scarpa.

        Tip: bus no. 6 leaves from one of the numbered bays of the bus station; the bay number is on the departure boards. Remember to tap your pass on the validator on the way back too.
