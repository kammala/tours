country: {en: Italy, ru: Италия}
city: {en: Florence, ru: Флоренция}
name: {en: "Wed 28 Oct · In depth: Boboli, the Oltrarno and the Uffizi", ru: "Ср, 28 окт · Подробно: сады Боболи, Ольтрарно и Уффици"}
place_suffix: Firenze
summary:
  ru: "≈ 6–8 км пешком, с 7:50 до ~17:30; туда и обратно на автобусе"
  en: "≈ 6–8 km on foot, 07:50 to ~17:30; bus there and back"
intro:
  ru: |
    Среда, 28 октября. Спокойный день без спешки: утром, пока прохладно и пусто, — сады Боболи к открытию в **8:15**, потом мастерские Ольтрарно, в обед — рынок Меркато Чентрале, где к вам присоединяется третий участник, а после обеда — **Уффици в 14:30**, все втроём (билеты с точным временем, именные, куплены заранее на www.uffizi.it).

    Маршрут: Casa Angi → автобус C4 → палаццо Питти и сады Боболи → Via Maggio → площадь Санто-Спирито → Борго Сан-Фредиано и старый газгольдер (по желанию) → рынок Меркато Чентрале → Уффици → площадь Синьории → Понте Веккьо на закате → автобус 23 домой.

    **Запасы времени.** Между обедом и Уффици — час: если рейс задержится, слот в 14:30 не сгорит. Сидячие паузы — каждые полтора-два часа: скамейки в Боболи и на площади Санто-Спирито, обед, скамейки в Уффици. Единственный подъём за день — в Боболи, и его можно ограничить нижними террасами.

    **Если идёт дождь**, Боболи пропускайте: дорожки там гравийные и крутые, а при штормовом предупреждении сад закрывают. Утро отдайте мастерским и кафе Ольтрарно.

    Машина сегодня стоит. Возьмите удобную обувь: в Боболи гравий и подъём, а в центре — брусчатка.
  en: |
    Wednesday 28 October. An unhurried day: the Boboli Gardens at their **08:15** opening while it's cool and empty, then the Oltrarno workshops, lunch at Mercato Centrale where the third person joins you, and after lunch the **Uffizi at 14:30**, all three of you (timed, named tickets booked in advance at www.uffizi.it).

    Route: Casa Angi → bus C4 → Palazzo Pitti and the Boboli Gardens → Via Maggio → Piazza Santo Spirito → Borgo San Frediano and the old gasometer (optional) → Mercato Centrale → Uffizi → Piazza della Signoria → Ponte Vecchio at sunset → bus 23 home.

    **Buffers.** There's an hour between lunch and the Uffizi, so a delayed flight won't cost you the 14:30 slot. There's a sit-down break every hour and a half to two hours: benches in Boboli and on Piazza Santo Spirito, lunch, the benches in the Uffizi. The day's only climb is in Boboli, and you can keep to the lower terraces.

    **If it rains**, skip Boboli: the paths are gravel and steep, and the garden closes under a weather warning. Give the morning to the Oltrarno's workshops and cafés.

    The car stays put today. Wear comfortable shoes: gravel and a climb in Boboli, cobbles in the centre.
outro:
  ru: |
    Ужин — в центре после Уффици или ближе к дому, у площади Ферруччи.

    Соберите вещи с вечера: завтра подъём около **7:30**, выезд около **9:00**, чтобы к **12:30** быть в Маргере.

    Завтра утром — выезд в Венецию. Машина стоит за пределами ZTL, так что сразу выезжайте на автостраду A1 через **Firenze Sud** и дальше на север через Болонью к Местре и Маргере — около 260 км, около 3 часов без учёта остановок. Центр Флоренции по дороге не пересекайте.
  en: |
    Dinner in the centre after the Uffizi, or closer to home around Piazza Ferrucci.

    Pack tonight: tomorrow it's up around **07:30** and away around **09:00**, to reach Marghera by **12:30**.

    Tomorrow morning you drive to Venice. The car is outside the ZTL, so head straight for the A1 at **Firenze Sud** and north via Bologna towards Mestre and Marghera — about 260 km, around 3 hours before stops. Don't cut through central Florence on the way.
points:
  - name: {en: Casa Angi, ru: Casa Angi}
    place: "Via de' Baldovini 19, 50126 Firenze"
    lat: 43.76255
    lng: 11.27528
    radius_m: 100
    short:
      ru: |
        Старт в **7:50**. 5 минут пешком до остановки **Cellini Ferrucci**, автобус **C4** в сторону Сан-Фредиано до палаццо **Питти**, около 15 минут. Сады Боболи открываются в 8:15.
      en: |
        Leave at **07:50**. Five minutes on foot to the **Cellini Ferrucci** stop, then bus **C4** towards San Frediano to Palazzo **Pitti**, about 15 minutes. The Boboli Gardens open at 08:15.
    long:
      ru: |
        C4 — маленький электробус, который петляет по Ольтрарно: по набережной Lungarno Serristori, мимо Понте Веккьо и к площади Питти. Каждый прикладывает к валидатору свою бесконтактную карту или телефон — это билет на 90 минут, около 2 €. Название остановки у Питти и направление проверьте в Google Maps или в приложении Autolinee Toscane.

        Совет: плотно позавтракайте до выхода — до обеда в 13:00 будут только скамейки в саду и на площади.
      en: |
        The C4 is a small electric bus that winds through the Oltrarno: along Lungarno Serristori, past Ponte Vecchio and up to Piazza Pitti. Each of you taps your own contactless card or phone on the reader — a 90-minute ticket, about €2. Check the stop name at Pitti and the direction in Google Maps or the Autolinee Toscane app.

        Tip: have a proper breakfast before you leave — until lunch at 13:00 the only breaks are benches in the garden and on the square.

  - name: {en: Palazzo Pitti and the Boboli Gardens, ru: Палаццо Питти и сады Боболи}
    place: "Palazzo Pitti, Piazza de' Pitti 1, Firenze"
    lat: 43.76560
    lng: 11.25030
    radius_m: 300
    inside:
      - {name: Anfiteatro di Boboli, lat: 43.76416, lng: 11.25087}
      - {name: Fontana del Nettuno, lat: 43.76299, lng: 11.25187}
      - {name: Statua dell'Abbondanza, lat: 43.76222, lng: 11.25254}
      - {name: Giardino del Cavaliere, lat: 43.76172, lng: 11.25201}
      - {name: Palazzo Pitti, lat: 43.76560, lng: 11.25030}
    walk_min: [5, 10]
    visit_min: [100, 120]
    audio: {ru: audio/italy/05-florence-in-depth/02.mp3}
    short:
      ru: |
        Сады открываются в **8:15** — вы среди первых. Вход через двор палаццо, касса справа от главного входа: **2 билета по 10 €**. Не спеша: амфитеатр → фонтан Нептуна → вид от статуи Изобилия; Сад рыцаря наверху — крутой подъём, по желанию. Около 10:15 выходите обратно через Питти. Если дождь — пропускайте и идите сразу на Via Maggio.
      en: |
        The gardens open at **08:15** — you're among the first in. Enter through the palace courtyard; the ticket desk is to the right of the main door: **2 tickets at €10**. At an easy pace: amphitheatre → Neptune Fountain → the view from the statue of Abundance; the Knight's Garden at the top is a steep climb, optional. Head back out through Pitti around 10:15. If it rains, skip it and go straight on to Via Maggio.
    long:
      ru: |
        Палаццо начал в 1458 году банкир Лука Питти, соперник Медичи, — и разорился, не достроив. В 1549 году дворец купила Элеонора Толедская, жена Козимо I, и он стал главной резиденцией Медичи, потом Лотарингской династии и Савойского дома. Холм за дворцом превратили в сад, ставший образцом «итальянского сада» для всей Европы: его закладывали Триболо, затем Амманнати и Буонталенти.

        Что посмотреть: **амфитеатр** прямо за дворцом, с египетским обелиском из Рима и гранитной античной чашей — здесь Медичи устраивали представления. Выше — **фонтан Нептуна** с бронзовым богом, которого прозвали «Нептун с вилкой», и на самом верху — **статуя Изобилия**, начатая Джамболоньей. Отсюда налево — **Сад рыцаря**, маленький регулярный сад на бастионе с видом на оливковые холмы и Музей фарфора. Спускаясь к выходу, загляните в **грот Буонталенти** у северного края и найдите фонтан **«Вакхино»**: на черепахе сидит придворный карлик Козимо I по прозвищу Морганте.

        Совет: билет только в Боболи — 10 € в кассе или 13 € онлайн; комбинированный с палаццо Питти не нужен, на музеи дворца сегодня нет времени. Подъём к статуе Изобилия крутой и гравийный, скамейки — по пути; утром, пока прохладно и пусто, идти легче всего. Передохните на скамейке у амфитеатра перед выходом. Если день дождливый, сад могут закрыть по погодному предупреждению — проверьте раздел новостей на www.uffizi.it.
      en: |
        The banker Luca Pitti, a Medici rival, began the palace in 1458 — and went broke before finishing it. In 1549 Eleonora of Toledo, wife of Cosimo I, bought it and it became the main Medici residence, later home to the Lorraine dynasty and the House of Savoy. The hill behind became the garden that set the pattern for "Italian gardens" all over Europe, laid out by Tribolo and then Ammannati and Buontalenti.

        Look for the **amphitheatre** right behind the palace, with an Egyptian obelisk brought from Rome and an ancient granite basin — the Medici staged shows here. Higher up is the **Neptune Fountain**, its bronze god nicknamed "Neptune with the fork", and at the very top the **statue of Abundance**, begun by Giambologna. From there turn left to the **Knight's Garden**, a small formal garden on a bastion with a view over the olive-covered hills, and the Porcelain Museum. On the way down, look into the **Buontalenti Grotto** at the northern edge and find the **Bacchino** fountain: Cosimo I's court dwarf, known as Morgante, astride a turtle.

        Tip: a Boboli-only ticket is €10 at the desk or €13 online; skip the combined Pitti ticket, there's no time for the palace museums today. The climb to Abundance is steep gravel, with benches along the way; it's easiest in the cool, empty morning. Rest on a bench by the amphitheatre before you leave. On a wet day the garden may close under a weather warning — check the notices at www.uffizi.it.

  - name: {en: Via Maggio, ru: Виа Маджо}
    place: "Via Maggio 26, Firenze"
    lat: 43.76673
    lng: 11.24895
    radius_m: 150
    walk_min: [3, 5]
    visit_min: [15, 20]
    audio: {ru: audio/italy/05-florence-in-depth/03.mp3}
    short:
      ru: |
        Улица антикваров и дворцов — от площади Питти через Сдруччоло-деи-Питти. Пройдите её не спеша в сторону реки и сверните налево на Via dei Michelozzi — она выводит прямо на площадь Санто-Спирито.
      en: |
        The street of antique dealers and palaces — from Piazza Pitti via the Sdrucciolo de' Pitti. Stroll it towards the river and turn left into Via dei Michelozzi, which comes out right on Piazza Santo Spirito.
    long:
      ru: |
        Название — сокращение от «Via Maggiore», «главная улица»: когда Медичи поселились в палаццо Питти, сюда потянулась знать, и улица застроилась дворцами XVI века. Сейчас первые этажи занимают антиквары, реставраторы мебели и галереи — витрины здесь как маленькие музеи.

        Что посмотреть: **палаццо Бьянки Каппелло** (№ 26) с фасадом, покрытым сграффито, — его построил для своей возлюбленной, венецианки Бьянки Каппелло, великий герцог Франческо I, сын Козимо. Совсем рядом, на площади Сан-Феличе, — **Каза Гуиди**, дом, где жили английские поэты Элизабет и Роберт Браунинг. По дороге от Питти не пропустите **Giulio Giannini e Figlio** на площади Питти — переплётная и бумажная мастерская, работающая с 1856 года.

        Совет: в антикварных лавках можно просто смотреть — хозяева привыкли. Тротуары здесь узкие, а машины ездят, держитесь у стены.
      en: |
        The name is short for "Via Maggiore", the main street: once the Medici moved into Palazzo Pitti, the nobility followed and lined the street with 16th-century palaces. Today the ground floors hold antique dealers, furniture restorers and galleries — shop windows like little museums.

        Look for **Palazzo di Bianca Cappello** (No. 26) with its sgraffito façade, built for his Venetian mistress Bianca Cappello by Grand Duke Francesco I, Cosimo's son. Just round the corner on Piazza San Felice is **Casa Guidi**, home of the English poets Elizabeth and Robert Browning. On the way from Pitti, don't miss **Giulio Giannini e Figlio** on Piazza Pitti, a bookbinding and paper workshop going since 1856.

        Tip: you can just browse in the antique shops — the owners are used to it. The pavements are narrow and cars do come through, so keep to the wall.

  - name: {en: Piazza Santo Spirito, ru: Площадь Санто-Спирито}
    lat: 43.76673
    lng: 11.24772
    radius_m: 150
    approach: [{name: Via dei Michelozzi, lat: 43.76695, lng: 11.24840}]
    walk_min: [3, 5]
    visit_min: [30, 45]
    audio: {ru: audio/italy/05-florence-in-depth/04.mp3}
    short:
      ru: |
        Сердце Ольтрарно. Церковь Брунеллески внутри **по средам закрыта** — смотрите фасад и площадь, а время отдайте мастерским на окрестных улицах: позолотчики, переплётчики, багетчики, реставраторы. Мастерские открываются около 9:30–10:00.
      en: |
        The heart of the Oltrarno. Brunelleschi's church is **closed to visitors on Wednesdays** — enjoy the façade and the square and give the time to the workshops in the surrounding streets: gilders, bookbinders, frame-makers, restorers. The workshops open around 09:30–10:00.
    long:
      ru: |
        Базилику Санто-Спирито спроектировал Брунеллески в 1444 году — это его последняя и, как считают многие архитекторы, самая совершенная работа: ряды серых каменных колонн внутри задают ритм всему пространству. Он умер, когда стройка только началась, а фасад так и не закончили — эта простая белёная стена стала символом площади. В сакристии хранится деревянное распятие юного Микеланджело — увидеть его можно в другие дни.

        Что посмотреть: сама площадь с фонтаном и деревьями — утром здесь небольшой рынок, а вечером площадь превращается в общую гостиную: бары, ступени церкви, вино в пластиковых стаканчиках. В пяти минутах вокруг, на **Via di Santo Spirito, Via Maffia, Via dello Sprone и Via Toscanella**, — мастерские, которые работают за открытыми дверями: золочение рам сусальным золотом, реставрация мебели, ручной переплёт, изделия из кожи.

        Совет: в мастерских принято сначала поздороваться и спросить, можно ли посмотреть, — многие мастера охотно показывают работу. Фотографировать — только с разрешения. Многие закрываются на обед примерно с 13:00 до 15:30, но к 16:00 всё снова открыто.
      en: |
        Brunelleschi designed the basilica of Santo Spirito in 1444 — his last and, many architects say, his most perfect work: inside, rows of grey stone columns set the rhythm of the whole space. He died just as building started, and the façade was never finished — that plain whitewashed wall has become the symbol of the square. The sacristy holds a wooden crucifix by the young Michelangelo — for another day.

        Look at the square itself, with its fountain and trees — a small market in the morning, and in the evening the city's shared living room: bars, the church steps, wine in plastic cups. Within five minutes, in **Via di Santo Spirito, Via Maffia, Via dello Sprone and Via Toscanella**, workshops carry on behind open doors: gilding frames with gold leaf, restoring furniture, hand bookbinding, leatherwork.

        Tip: in a workshop, say hello and ask whether you can look before walking in — many craftsmen are happy to show their work. Photos only with permission. Many close for lunch from about 13:00 to 15:30, but by 16:00 everything is open again.

  - name: {en: "Borgo San Frediano — optional", ru: "Борго Сан-Фредиано — по желанию"}
    place: "Porta San Frediano, Firenze"
    lat: 43.77030
    lng: 11.24124
    radius_m: 300
    approach: [{name: Piazza del Carmine, lat: 43.76875, lng: 11.24423}]
    inside: ["Chiesa di San Frediano in Cestello, Firenze", {name: Porta San Frediano, lat: 43.77051, lng: 11.24018}]
    walk_min: [10, 15]
    visit_min: [45, 75]
    audio: {ru: audio/italy/05-florence-in-depth/05.mp3}
    short:
      ru: |
        Только если есть силы. Через площадь Кармине в старый рабочий квартал: Борго от церкви Сан-Фредиано-ин-Честелло до городских ворот — мастерские, булочные, винные бары. В **12:00** — к газгольдеру за воротами или сразу на обед.
      en: |
        Only if you have the energy. Through Piazza del Carmine into the old working-class quarter: the Borgo from San Frediano in Cestello to the city gate — workshops, bakeries, wine bars. At **12:00** head out of the gate to the gasometer, or straight to lunch.
    long:
      ru: |
        Сан-Фредиано веками был кварталом ткачей, кожевников и прачек — бедным, шумным и гордым. Его прославил Васко Пратолини в романе «Девушки из Сан-Фредиано»; в 2020-х Lonely Planet включил квартал в список самых интересных районов мира. Туристов здесь по-прежнему немного: ремесленные мастерские соседствуют с модными винными барами и обычными булочными.

        Что посмотреть: на площади Кармине — церковь **Санта-Мария-дель-Кармине** с капеллой Бранкаччи, где фрески Мазаччо открыли живопись Возрождения (вход по записи). Дальше — купол **Сан-Фредиано-ин-Честелло** над рекой и в конце улицы — **Порта Сан-Фредиано** 1330-х годов, ворота с огромными деревянными створками, сохранившимися со Средних веков. На Via Lorenzo Bartolini, в двух шагах, — **Antico Setificio Fiorentino**, шёлкоткацкая мастерская XVIII века, которая до сих пор работает на старинных станках (посещение по записи).

        Совет: от Порта Сан-Фредиано до рынка Меркато Чентрале — около 25 минут через мост Понте-алла-Карраия. Если устали, пропустите Борго: от Санто-Спирито через мост Санта-Тринита до рынка — около 20 минут.
      en: |
        For centuries San Frediano was the quarter of weavers, tanners and washerwomen — poor, noisy and proud. Vasco Pratolini made it famous in his novel The Girls of San Frediano, and in the 2020s Lonely Planet put it on its list of the world's coolest neighbourhoods. There are still few tourists: craft workshops sit next to fashionable wine bars and ordinary bakeries.

        On Piazza del Carmine stands **Santa Maria del Carmine** with the Brancacci Chapel, where Masaccio's frescoes launched Renaissance painting (booking required). Further on is the dome of **San Frediano in Cestello** over the river, and at the end of the street **Porta San Frediano** from the 1330s, whose huge wooden doors survive from the Middle Ages. A few steps away on Via Lorenzo Bartolini is the **Antico Setificio Fiorentino**, an 18th-century silk-weaving workshop still working its old looms (visits by appointment).

        Tip: from Porta San Frediano to Mercato Centrale is about 25 minutes over Ponte alla Carraia. If you're tired, skip the Borgo: from Santo Spirito over Ponte Santa Trinita to the market is about 20 minutes.

  - name: {en: "The old gasometer — optional", ru: "Старый газгольдер — по желанию"}
    place: "43.77135,11.23883"
    lat: 43.77135
    lng: 11.23883
    radius_m: 120
    approach: [{name: Porta San Frediano, lat: 43.77051, lng: 11.24018}]
    walk_min: [3, 5]
    visit_min: [10, 15]
    short:
      ru: |
        Сразу за воротами Сан-Фредиано, на Via dell'Anconella, — железный каркас газгольдера XIX века посреди сквера с огородами. Пять минут посмотреть — и к **12:15** на обед.
      en: |
        Just outside Porta San Frediano, on Via dell'Anconella: the iron frame of a 19th-century gasometer in a small park with allotments. Five minutes to look, then off to lunch by **12:15**.
    long:
      ru: |
        Газовую промышленность город пустил сюда, за городские ворота, в середине XIX века: газгольдер построили в **1845 году** и расширили в **1896-м**. Это был не завод, а гигантский «буфер»: огромный колокол поднимался и опускался в резервуаре, держал ровное давление в городской газовой сети и смешивал газ. Со временем газгольдеров стало четыре; остальные разобрали, а этот работал до 1970-х.

        Сегодня от него остался только клёпаный железный каркас — один из немногих памятников промышленной архитектуры XIX века во Флоренции, он охраняется как наследие. Десятилетиями вокруг был заброшенный пустырь; в 2022 году жители и местные ассоциации разбили здесь городские огороды, а с января 2025-го каркас по вечерам подсвечивают. Город обещает дать ему новую жизнь — проекты с бассейном и кафе наверху обсуждают с 2011 года.

        Совет: отсюда до рынка Меркато Чентрале — около 30 минут через мост Понте-алла-Карраия; если устали, у ворот Сан-Фредиано ходят автобусы в центр, или возьмите такси.
      en: |
        The city put its gas industry out here, beyond the walls, in the mid-19th century: the gasometer was built in **1845** and enlarged in **1896**. It wasn't the gasworks itself but a giant buffer: a huge bell rose and sank in its tank, keeping the city's gas network at steady pressure and mixing the gas. Over time there were four gasometers; the others were dismantled, and this one worked until the 1970s.

        Today only the riveted iron frame is left — one of Florence's few pieces of 19th-century industrial architecture, protected as heritage. For decades the ground around it was derelict; in 2022 residents and local associations laid out urban allotments, and since January 2025 the frame has been lit up in the evenings. The city keeps promising it a new life — schemes with a pool and a café on top have been discussed since 2011.

        Tip: from here to Mercato Centrale is about 30 minutes over Ponte alla Carraia; if you're tired, buses to the centre stop by Porta San Frediano, or take a taxi.

  - name: {en: Mercato Centrale, ru: Рынок Меркато Чентрале}
    place: "Mercato Centrale, Via dell'Ariento, Firenze"
    lat: 43.77660
    lng: 11.25320
    radius_m: 150
    approach: ["Ponte Santa Trinita, Firenze", {name: Via de' Tornabuoni, lat: 43.77120, lng: 11.25130}, {name: Piazza San Lorenzo, lat: 43.77507, lng: 11.25406}]
    walk_min: [20, 25]
    visit_min: [60, 75]
    audio: {ru: audio/italy/05-florence-in-depth/06.mp3}
    short:
      ru: |
        Будьте здесь к **12:45** и займите стол на втором этаже, в фуд-холле. **Здесь к вам присоединяется третий участник:** рейс KL1653 садится около 12:00, от аэропорта — трамвай **T2** до остановки **Unità** (20–25 минут, оплата бесконтактной картой), оттуда 7 минут пешком; встреча около 13:00. Чемодан берёт с собой — в Уффици его бесплатно примут в гардероб. В **14:00** выходите к Уффици.
      en: |
        Be here by **12:45** and grab a table upstairs in the food hall. **The third person joins you here:** flight KL1653 lands around 12:00; from the airport take tram **T2** to **Unità** (20–25 minutes, tap a contactless card), then a 7-minute walk; meet around 13:00. The suitcase comes along — the Uffizi cloakroom takes it for free. Leave for the Uffizi at **14:00**.
    long:
      ru: |
        Чугунно-стеклянный павильон построил в 1874 году Джузеппе Менгони — тот самый, что спроектировал галерею Виктора Эммануила в Милане. Рынок появился, когда Флоренция, недолго побывшая столицей Италии, перестраивала центр и сносила старый рынок на месте нынешней площади Республики. Внизу до сих пор торгуют мясом, сыром, рыбой, трюфелями и овощами для местных.

        Что посмотреть: на первом этаже — прилавки с пармской ветчиной, пекорино и белыми грибами, и знаменитая закусочная **Da Nerbone**, которая работает здесь с 1872 года, — классика флорентийского стрит-фуда, **лампредотто** (сычуг в бульоне в булке с зелёным соусом). На втором этаже, открытом в 2014 году, — большой зал с общими столами и прилавками: паста, пицца, бистекка, моцарелла, вино. Каждый берёт что хочет, и садитесь вместе.

        Совет: займите стол сразу, а потом идите за едой по очереди. Вокруг рынка — уличные палатки кожевенного рынка Сан-Лоренцо; торгуйтесь, а качество проверяйте внимательно. Проходя Дуомо, взгляните на купол ещё раз при дневном свете — вчера вы видели его уже к вечеру.
      en: |
        Giuseppe Mengoni — the architect of the Galleria Vittorio Emanuele in Milan — built this cast-iron and glass hall in 1874. It went up while Florence, briefly capital of Italy, was rebuilding its centre and demolishing the old market where Piazza della Repubblica is now. Downstairs it still sells meat, cheese, fish, truffles and vegetables to locals.

        On the ground floor look for counters of Parma ham, pecorino and porcini, and **Da Nerbone**, trading here since 1872 — the classic Florentine street food is **lampredotto**, tripe simmered in broth, served in a roll with green sauce. Upstairs, opened in 2014, is a big hall of shared tables and counters: pasta, pizza, bistecca, mozzarella, wine. Everyone gets what they fancy and you sit together.

        Tip: grab a table first, then take turns fetching food. Around the market are the street stalls of the San Lorenzo leather market — haggle, and check quality carefully. Passing the Duomo, take another look at the dome in daylight — yesterday you saw it late in the afternoon.

  - name: {en: Uffizi Gallery, ru: Галерея Уффици}
    place: "Galleria degli Uffizi, Piazzale degli Uffizi 6, Firenze"
    lat: 43.76812
    lng: 11.25560
    radius_m: 120
    approach: [{name: Piazza del Duomo, lat: 43.77290, lng: 11.25600}, {name: Via dei Calzaiuoli, lat: 43.77154, lng: 11.25533}]
    walk_min: [15, 20]
    visit_min: [150, 160]
    short:
      ru: |
        Мимо Дуомо по Via dei Calzaiuoli, к **14:15** — у входа для забронированных билетов (номер двери — в письме). Билеты на **14:30**, на троих. На досмотре чемодан и сумки — в гардероб, бесплатно. На осмотр 2–2,5 часа; музей открыт до 18:30.
      en: |
        Past the Duomo and down Via dei Calzaiuoli to be at the pre-booked entrance by **14:15** (the door number is in your email). Tickets for **14:30**, for three. After security the suitcase and bags go to the cloakroom, free. Allow 2–2.5 hours; the museum is open until 18:30.
    long:
      ru: |
        Здание построил Джорджо Вазари в 1560-х годах для Козимо I Медичи как правительственные конторы — «уффици» и значит «офисы». Верхний этаж Медичи скоро превратили в галерею для своей коллекции, а в 1737 году последняя из рода, Анна Мария Луиза, завещала всё собрание Флоренции с условием, что оно никогда не покинет город. Поэтому всё это до сих пор здесь.

        Что посмотреть: залы **Боттичелли** — «Рождение Венеры» и «Весна»; **«Благовещение» Леонардо** и его неоконченное «Поклонение волхвов»; восьмиугольная **Трибуна** Медичи с куполом, выложенным перламутром; **«Тондо Дони» Микеланджело** — единственная его законченная станковая картина во Флоренции; «Венера Урбинская» Тициана, Рафаэль и, на нижнем этаже, **Караваджо** — «Медуза» и «Вакх». Из окон коридора над Арно — вид на Понте Веккьо сверху.

        Совет: днём залы Боттичелли самые людные — если там толпа, сначала посмотрите Трибуну, а к Боттичелли вернитесь. Скамейки есть почти в каждом зале. Кафе на террасе над Лоджией деи Ланци — хорошая передышка с видом на купол собора и башню Палаццо Веккьо. Чемоданы, рюкзаки и большие сумки сдают в гардероб бесплатно.

        Подробный маршрут по залам с аудиорассказами — [Уффици по залам](#/tour/italy/05-florence-uffizi/1).
      en: |
        Giorgio Vasari built it in the 1560s for Cosimo I de' Medici as government offices — "uffizi" simply means offices. The Medici soon turned the top floor into a gallery for their collection, and in 1737 the last of the line, Anna Maria Luisa, left the whole lot to Florence on condition it never leave the city. That's why it is all still here.

        Look for the **Botticelli** rooms — the Birth of Venus and Primavera; **Leonardo's Annunciation** and his unfinished Adoration of the Magi; the octagonal Medici **Tribuna** with its mother-of-pearl dome; **Michelangelo's Doni Tondo**, his only finished panel painting in Florence; Titian's Venus of Urbino, Raphael and, on the lower floor, **Caravaggio**'s Medusa and Bacchus. The windows of the corridor over the Arno look straight down on Ponte Vecchio.

        Tip: in the afternoon the Botticelli rooms are the busiest — if they're packed, see the Tribuna first and come back. There are benches in almost every room. The café terrace on top of the Loggia dei Lanzi is a good break with a view of the dome and Palazzo Vecchio's tower. Suitcases, backpacks and large bags go to the cloakroom for free.

        A room-by-room route with audio narration: [The Uffizi room by room](#/tour/italy/05-florence-uffizi/1).

  - name: {en: Ponte Vecchio at sunset, ru: Понте Веккьо на закате}
    lat: 43.76803
    lng: 11.25316
    radius_m: 120
    approach: [{name: Piazza della Signoria, lat: 43.76956, lng: 11.25561}]
    walk_min: [3, 5]
    visit_min: [15, 20]
    audio: {ru: audio/italy/05-florence-in-depth/08.mp3}
    short:
      ru: |
        Заберите чемодан, выйдите на площадь Синьории и через пару минут — на мост. Встаньте у открытых арок посередине: закат около 17:10, и Арно розовеет в обе стороны.
      en: |
        Collect the suitcase, step out onto Piazza della Signoria and in a couple of minutes you're on the bridge. Stand at the open arches in the middle: sunset is about 17:10, and the Arno turns pink both ways.
    long:
      ru: |
        Мост на этом месте стоит с римских времён; нынешний построен в 1345 году после большого наводнения. Это единственный флорентийский мост, который уцелел в 1944 году, когда отступавшие немецкие войска взорвали все остальные. Лавки на нём были всегда, но сначала здесь торговали мясники и кожевники; в 1593 году великий герцог Фердинанд I выгнал их и пустил на мост ювелиров — с тех пор здесь только золото.

        Что посмотреть: над лавками по левой стороне идёт **коридор Вазари** — крытый проход 1565 года, по которому Медичи ходили из Палаццо Веккьо через Уффици в палаццо Питти, не выходя на улицу. В середине моста — бюст ювелира **Бенвенуто Челлини** и открытые арки с видом вдоль реки.

        Совет: для третьего участника это первая встреча с мостом, для вас — вторая, уже в вечернем свете. Лавки закрываются около 19:00, деревянные ставни на ночь превращают мост в ряд сундуков.
      en: |
        There has been a bridge here since Roman times; this one was built in 1345 after a great flood. It's the only Florentine bridge that survived 1944, when the retreating German army blew up all the others. There have always been shops on it, but at first they were butchers and tanners; in 1593 Grand Duke Ferdinando I threw them out and moved the goldsmiths in — it's been gold ever since.

        Look up along the left-hand side at the **Vasari Corridor**, the covered passage of 1565 that let the Medici walk from Palazzo Vecchio through the Uffizi to Palazzo Pitti without going outside. In the middle of the bridge are the bust of the goldsmith **Benvenuto Cellini** and the open arches with the view along the river.

        Tip: for the third person it's a first look at the bridge, for you a second one, in the evening light. The shops close around 19:00, and their wooden shutters turn the bridge into a row of chests for the night.

  - name: {en: Back to Casa Angi, ru: Обратно в Casa Angi}
    place: "Via de' Baldovini 19, 50126 Firenze"
    lat: 43.76255
    lng: 11.27528
    radius_m: 100
    approach: [{name: Lungarno Generale Diaz, lat: 43.76760, lng: 11.25780}, "Ponte alle Grazie, Firenze"]
    walk_min: [10, 30]
    short:
      ru: |
        Финиш. По набережной до моста Понте-алле-Грацие, 8–10 минут. Домой — автобус **23** в сторону **Sorgane / Bagno a Ripoli** от остановки у моста Понте-алле-Грацие до **Baldovini**, около 15 минут; или 30 минут пешком вдоль реки.
      en: |
        Finish. Along the embankment to Ponte alle Grazie, 8–10 minutes. Home on bus **23** towards **Sorgane / Bagno a Ripoli** from the stop by Ponte alle Grazie to **Baldovini**, about 15 minutes; or a 30-minute walk along the river.
    long:
      ru: |
        От Понте Веккьо до моста Понте-алле-Грацие — 8–10 минут по набережной. Автобус 23 идёт через мост и по Lungarno Serristori, а остановка **Baldovini** — прямо у дома. Точное место остановки и время проверьте в Google Maps или в приложении Autolinee Toscane.

        Совет: ужинать можно в центре, пока вы ещё здесь, или у дома — у площади Ферруччи и на Viale Giannotti заметно дешевле. Перед сном соберите вещи и проверьте дорогу на Венецию — выезд утром, через Firenze Sud, в объезд центра.
      en: |
        From Ponte Vecchio to Ponte alle Grazie is 8–10 minutes along the embankment. Bus 23 crosses the bridge and runs along Lungarno Serristori, and the **Baldovini** stop is right outside the house. Check the exact stop and times in Google Maps or the Autolinee Toscane app.

        Tip: have dinner in the centre while you're here, or near home — around Piazza Ferrucci and Viale Giannotti it's noticeably cheaper. Pack before bed and check the route to Venice — you leave in the morning via Firenze Sud, round the centre.
