  - name: {en: "Piazzale Roma — vaporetto 4.2 to San Michele", ru: "Пьяццале Рома — вапоретто 4.2 до Сан-Микеле"}
    place: "Piazzale Roma, Venezia"
    lat: 45.43801
    lng: 12.31885
    radius_m: 250
    visit_min: [30, 35]
    short:
      ru: |
        С причала Piazzale Roma — линия **4.2** в сторону **Fondamente Nove / Murano**, выйти на **Cimitero** (остров Сан-Микеле), около 30 минут без пересадки (через Ferrovia, Guglie, Orto и Fondamente Nove). На табло проверьте: нужна 4.2 — 5.2 на Мурано не идёт, а 4.1 идёт по кругу в другую сторону.
      en: |
        From the Piazzale Roma pier take line **4.2** towards **Fondamente Nove / Murano** and get off at **Cimitero** (San Michele island), about 30 minutes with no change (via Ferrovia, Guglie, Orto and Fondamente Nove). Check the board: you want the 4.2 — the 5.2 doesn't go to Murano, and the 4.1 goes round the other way.
    long:
      ru: |
        Катер идёт по каналу Каннареджо под каменным мостом **Гулье** с четырьмя обелисками-шпилями, затем вдоль северного берега, где туристов почти нет: верфи, лодочные гаражи, вид на лагуну. Вечером вы вернётесь в этот же район. От Фондаменте-Нове катер пересекает узкий пролив к острову-кладбищу за кирпичной стеной.

        Совет: садитесь, и пусть город проплывает мимо — пешком до Фондаменте-Нове было бы 40 минут и два десятка мостов со ступенями.
      en: |
        The boat runs down the Cannaregio Canal under the stone **Ponte delle Guglie** with its four obelisk spires, then along the north shore, where there are hardly any tourists: boatyards, boat sheds, views of the lagoon. You'll be back in this district tonight. From Fondamente Nove the boat crosses the narrow strait to the cemetery island behind its brick wall.

        Tip: sit back and let the city drift by — on foot even Fondamente Nove would be 40 minutes and a couple of dozen stepped bridges.

  - name: {en: San Michele cemetery, ru: Кладбище Сан-Микеле}
    place: "Cimitero di San Michele, Venezia"
    lat: 45.44664
    lng: 12.34563
    radius_m: 250
    walk_min: 2
    visit_min: [50, 60]
    short:
      ru: |
        Около 10:45, причал Cimitero — у самого входа. Кладбище открыто с 7:30 (закрытие в 16:30 или 18:00 — нам не важно, мы здесь утром); у входа — карта участков, справки в сторожке: 041 729 2841. Сегодня канун Дня всех святых: венецианские семьи везут цветы, людей больше обычного. Говорите тихо, плечи прикрыты. Около 45–50 минут, потом 4.1 или 4.2 — одна остановка до **Murano Colonna**, около 5 минут.
      en: |
        Around 10:45; the Cimitero pier is right at the gate. Open from 07:30 (closing at 16:30 or 18:00 — irrelevant, you're here in the morning); there's a map of the sections at the entrance, and the porter's lodge is on 041 729 2841. It's the eve of All Saints' Day: Venetian families come with flowers, so it's busier than usual. Keep your voices down and shoulders covered. About 45–50 minutes, then the 4.1 or 4.2 one stop to **Murano Colonna**, about 5 minutes.
    long:
      ru: |
        До Наполеона венецианцев хоронили при приходских церквях, прямо в городе. Французские власти запретили это как опасное для здоровья, и в 1807 году под общее городское кладбище отвели островок Сан-Кристофоро; позже канал между ним и соседним Сан-Микеле засыпали, и получился один остров за кирпичной стеной с кипарисами. Хоронят здесь до сих пор. У причала — церковь **Сан-Микеле-ин-Изола** Мауро Кодуччи из белого истрийского камня, построенная во второй половине XV века: её считают первой ренессансной церковью Венеции.

        **Иосиф Бродский** похоронен на протестантском участке (*Recinto Evangelico*). Он умер в Нью-Йорке в январе 1996 года, а в 1997-м его перезахоронили здесь: Венецию он любил и много лет приезжал сюда зимой — об этом его эссе «Набережная неисцелимых». На оборотной стороне надгробия — строка Проперция по-латыни: *Letum non omnia finit*, «Не всё кончается со смертью». На могилу оставляют записки, ручки, камешки и стихи. В нескольких шагах от него — американский поэт **Эзра Паунд**.

        На православном участке (*Recinto Greco*) — **Игорь Стравинский** (рядом с ним его жена Вера) и **Сергей Дягилев**, умерший в Венеции в 1929 году; на его могилу балетные танцовщики приносят пуанты.

        Совет: участки обнесены своими оградами, ищите таблички *Recinto Evangelico* и *Recinto Greco* — они рядом друг с другом. Захватите ручку или открытку, если хотите оставить что-то у Бродского.
      en: |
        Until Napoleon, Venetians were buried by their parish churches, right in the city. The French authorities banned this as a health hazard, and in 1807 the islet of San Cristoforo was set aside as the city cemetery; later the canal between it and neighbouring San Michele was filled in, making one island behind a brick wall lined with cypresses. Burials still take place here. By the pier stands **San Michele in Isola**, Mauro Codussi's church of white Istrian stone from the second half of the 15th century, considered the first Renaissance church in Venice.

        **Joseph Brodsky** is buried in the Protestant section (*Recinto Evangelico*). He died in New York in January 1996 and was reburied here in 1997: he loved Venice and came back for many winters, which he wrote about in his essay "Watermark". On the back of the gravestone is a line of Propertius in Latin, *Letum non omnia finit*, "Death does not end everything". People leave notes, pens, pebbles and poems on the grave. A few steps away lies the American poet **Ezra Pound**.

        In the Orthodox section (*Recinto Greco*) are **Igor Stravinsky** (with his wife Vera beside him) and **Sergei Diaghilev**, who died in Venice in 1929; dancers leave ballet shoes on his grave.

        Tip: the sections have their own enclosures; look for the *Recinto Evangelico* and *Recinto Greco* signs, which are close together. Bring a pen or a postcard if you'd like to leave something for Brodsky.

  - name: {en: "Murano: Fondamenta dei Vetrai", ru: "Мурано: Фондамента деи Ветраи"}
    place: "Fondamenta dei Vetrai, Murano"
    lat: 45.45250
    lng: 12.35065
    radius_m: 300
    walk_min: [2, 3]
    visit_min: [55, 60]
    short:
      ru: |
        Около 11:45. От причала Colonna — сразу на главную улицу стеклодувов: мастерские, магазины и стекло в витринах. Утром печи работают — ищите открытую мастерскую с показом.
      en: |
        Around 11:45. From the Colonna pier straight onto the glassmakers' main street: workshops, shops and glass in every window. In the morning the furnaces are running — look for an open workshop with a demonstration.
    long:
      ru: |
        В 1291 году республика перевела все стеклодувные печи из города на Мурано — из страха пожаров и, заодно, чтобы сохранить секреты ремесла. Мастерам давали привилегии, их дочери могли выходить замуж за патрициев, но уезжать из республики стеклодувам запрещалось под страхом смерти. Здесь изобрели прозрачное стекло «кристалло», зеркала и многоцветную мозаику «миллефиори».

        Что посмотреть: на Фондамента деи Ветраи и соседних набережных — мастерские с открытыми печами, где показывают, как выдувают вазу или лепят лошадку за пару минут; витрины с люстрами и стеклом. Пройдите набережную до моста, через канал — на Фондамента Даниэле Манин, и по ней к маяку и причалу Faro.

        Совет: настоящее муранское стекло помечено знаком **«Vetro Artistico Murano»**; дешёвые сувениры часто сделаны в Азии. Показы в печах обычно бесплатные или за несколько евро, а после них ведут в магазин — покупать не обязательно. Около 12:40 двигайтесь к причалу Faro.
      en: |
        In 1291 the Republic moved every glass furnace from the city to Murano, out of fear of fire and, conveniently, to keep the craft's secrets. Glassmakers were granted privileges, and their daughters could marry patricians, but leaving the Republic was forbidden on pain of death. Clear "cristallo" glass, mirrors and many-coloured "millefiori" mosaic glass were invented here.

        Along the Fondamenta dei Vetrai and nearby quays are workshops with open furnaces where you can watch a vase blown or a little horse shaped in a couple of minutes, and windows full of chandeliers and glass. Walk the quay to the bridge, cross to the Fondamenta Daniele Manin and follow it to the lighthouse and the Faro pier.

        Tip: genuine Murano glass carries the **"Vetro Artistico Murano"** mark; cheap souvenirs are often made in Asia. Furnace demonstrations are usually free or a few euros, and lead into a shop — no obligation to buy. Head for the Faro pier around 12:40.

  - name: {en: "Murano Faro — vaporetto 12 to Burano", ru: "Мурано-Фаро — вапоретто № 12 до Бурано"}
    place: "45.45266,12.35470"
    lat: 45.45266
    lng: 12.35470
    approach: [{name: Fondamenta Daniele Manin, lat: 45.45359, lng: 12.35207}]
    walk_min: [8, 10]
    visit_min: [30, 35]
    short:
      ru: |
        Линия **12** на **Burano**, около 30 минут (через Маццорбо). Целимся на катер около 12:50; если полный — следующий примерно через полчаса, к 14:30 всё равно успеваете.
      en: |
        Line **12** to **Burano**, about 30 minutes (via Mazzorbo). Aim for the boat around 12:50; if it's full, the next is about half an hour later and you still make 14:30.
    long:
      ru: |
        Причал назван по белому маяку Мурано (1934) рядом с ним. Катер обходит Маццорбо и идёт через северную лагуну мимо заброшенных островков и рыбацких свай. При хорошей погоде на горизонте видны Доломиты.

        Совет: некоторые рейсы № 12 заходят на Торчелло — смотрите табло, чтобы не уехать мимо Бурано.
      en: |
        The pier is named after the white Murano lighthouse (1934) beside it. The boat rounds Mazzorbo and crosses the northern lagoon past abandoned islets and fishing stakes. On a clear day the Dolomites show on the horizon.

        Tip: some no. 12 runs call at Torcello — check the board so you don't sail past Burano.

  - name: {en: "Burano: Tre Ponti and the coloured houses", ru: "Бурано: Тре-Понти и цветные дома"}
    place: "Ponte dei Tre Ponti, Burano"
    lat: 45.48545
    lng: 12.41540
    radius_m: 400
    inside:
      - {name: Fondamenta della Pescheria, lat: 45.48489, lng: 12.41632}
      - {name: Casa di Bepi Suà, lat: 45.48574, lng: 12.41817}
    walk_min: 5
    visit_min: [30, 45]
    short:
      ru: |
        Около 13:30, 5 минут от причала. Неспешная прогулка по каналам острова, лучшие ракурсы — с мостиков. Дом Бепи Суа с геометрическим узором — в двух шагах от главной улицы.
      en: |
        Around 13:30, 5 minutes from the pier. A slow wander along the island's canals; the best angles are from the little bridges. Bepi Suà's house with its geometric patterns is just off the main street.
    long:
      ru: |
        Бурано — рыбацкий остров, заселённый, по преданию, ещё беглецами с материка в эпоху варварских нашествий. Дома здесь красят в яркие цвета: говорят, чтобы рыбаки узнавали свой дом в лагунном тумане. Традиция настолько строгая, что для перекраски нужно разрешение коммуны, которая выбирает цвет из допустимых для каждого участка.

        Что посмотреть: **Тре-Понти** — перекрёсток каналов с тремя мостиками; **Фондамента делла Пескерия** с рыбным рынком; дом **Бепи Суа** — Джузеппе Тозелли, местного продавца сладостей, расписавшего свой фасад узорами из кругов и треугольников. В конце главной улицы — деревянный мост **Понте-Лонго** на соседний остров Маццорбо с виноградником Venissa.

        Совет: на главной улице днём многолюдно, а боковые улочки за площадью — гораздо тише. Не заглядывайте в окна и двери — это жилые дома.
      en: |
        Burano is a fishing island, settled, legend says, by refugees from the mainland during the barbarian invasions. The houses are painted bright colours, supposedly so fishermen could find home in the lagoon fog. The tradition is strict: repainting needs permission from the municipality, which picks a colour from those allowed for each plot.

        Look at **Tre Ponti**, a junction of canals with three little bridges; the **Fondamenta della Pescheria** with its fish market; and the house of **Bepi Suà** — Giuseppe Toselli, a local sweet seller who painted his façade with circles and triangles. At the end of the main street the wooden **Ponte Longo** crosses to neighbouring Mazzorbo and the Venissa vineyard.

        Tip: the main street is busy in the afternoon; the side streets behind the square are much quieter. Don't peer into windows and doors — these are people's homes.

  - name: {en: "Piazza Galuppi and the leaning bell tower", ru: "Площадь Галуппи и падающая колокольня"}
    place: "Piazza Baldassare Galuppi, Burano"
    lat: 45.48450
    lng: 12.41870
    inside:
      - {name: Chiesa di San Martino, lat: 45.48418, lng: 12.41881}
      - {name: Museo del Merletto, lat: 45.48473, lng: 12.41872}
    walk_min: 5
    visit_min: [30, 40]
    short:
      ru: |
        Главная площадь острова: церковь Сан-Мартино с заметно наклонённой колокольней и Музей кружева (вт–вс, примерно до 16:00 — только до обеда). Кофе и буссолаи здесь — чтобы дотянуть до 14:30.
      en: |
        The island's main square: San Martino church with its visibly tilting bell tower, and the Lace Museum (Tue–Sun, until about 16:00 — so before lunch only). Coffee and bussolai here to tide you over to 14:30.
    long:
      ru: |
        Площадь носит имя композитора **Бальдассаре Галуппи** по прозвищу Буранелло, родившегося здесь в 1706 году, — одного из отцов комической оперы; он несколько лет служил при дворе Екатерины II в Петербурге.

        Что посмотреть: **колокольня Сан-Мартино** XVIII века отклонилась от вертикали почти на два метра — лучше всего это видно с набережных за площадью. В церкви — «Распятие» Джованни Баттисты Тьеполо. **Музей кружева** размещён в здании бывшей кружевной школы (1872–1970): буранское кружево «пунто ин арья» («стежок в воздухе») шьют иглой без основы, и на маленький воротник уходят месяцы. Иногда в музее работают кружевницы. На музей хватит получаса.

        Совет: обед поздний — выпейте кофе и купите **буссолаи** и **эсси**, буранское сливочное печенье в форме кольца и буквы «S», которое рыбаки брали в море; его продают в пекарнях на главной улице, и оно долго хранится — хороший подарок. Настоящее ручное кружево Бурано стоит дорого; дешёвые салфетки в сувенирных лавках обычно машинные и привозные.
      en: |
        The square is named after the composer **Baldassare Galuppi**, nicknamed Il Buranello, born here in 1706 — one of the fathers of comic opera, who spent several years at the court of Catherine the Great in St Petersburg.

        Look at the 18th-century **San Martino bell tower**, which leans almost two metres off vertical — best seen from the quays behind the square. Inside the church is a Crucifixion by Giambattista Tiepolo. The **Lace Museum** is in the former lace school (1872–1970): Burano lace, "punto in aria" ("stitch in the air"), is worked with a needle and no backing fabric, and a small collar takes months. Sometimes lacemakers work in the museum. Half an hour is enough for it.

        Tip: lunch is late, so have a coffee and pick up some **bussolai** and **essi**, Burano's buttery biscuits shaped like rings and the letter "S", which fishermen took to sea; bakeries on the main street sell them, and they keep well — a good gift. Real handmade Burano lace is expensive; cheap doilies in souvenir shops are usually machine-made imports.

  - name: {en: "Lunch at Gatto Nero, 14:30", ru: "Обед в Gatto Nero, 14:30"}
    place: "Trattoria al Gatto Nero, Fondamenta della Giudecca 88, Burano"
    lat: 45.48475
    lng: 12.41636
    walk_min: 5
    visit_min: [120, 150]
    short:
      ru: |
        **Забронировано: 14:30, трое, дегустационное меню.** Бронь строго на троих. Закладывайте 2–2½ часа.
      en: |
        **Booked: 14:30, three people, tasting menu.** The booking is binding for three. Allow 2–2½ hours.
    long:
      ru: |
        **Gatto Nero** — семейная траттория у канала, любимая самими венецианцами. Главное блюдо острова — **ризотто ди го**. **Го** — бычок-ghiozzo, мелкая лагунная рыбка, костлявая и почти несъедобная сама по себе, зато дающая очень ароматный бульон. Рыбу долго варят, протирают, и на этом бульоне готовят ризотто — нежное, «волной» (*all’onda*), без кусочков рыбы. Рецепт считается гордостью Бурано; за звание хранителя оригинала с Gatto Nero спорит **Da Romano** на Via Galuppi, работающая с 1920 года.

        Что ещё попробовать: жареную рыбу и моеке — мягких лагунных крабов (сезон весной и осенью).

        Совет: если ризотто ди го не входит в дегустационное меню, спросите, можно ли его добавить, — ради него сюда и едут. Обратный № 12 ходит примерно раз в полчаса: под конец обеда посмотрите расписание и просите счёт заранее.
      en: |
        **Gatto Nero** is a family trattoria on the canal, much loved by Venetians themselves. The island's signature dish is **risotto di gò**. **Gò** is the grass goby (ghiozzo), a tiny lagoon fish, bony and almost inedible on its own, but it makes a wonderfully fragrant broth. The fish is simmered for a long time and sieved, and the risotto is cooked in that broth — soft and "wavy" (*all'onda*), with no pieces of fish. The recipe is Burano's pride; **Da Romano** on Via Galuppi, open since 1920, vies with Gatto Nero for the title of keeper of the original.

        Also try fried fish and moeche, soft-shell lagoon crabs (in season in spring and autumn).

        Tip: if risotto di gò isn't on the tasting menu, ask whether it can be added — it's the reason to come here. The no. 12 back runs about every half hour: check the times towards the end of the meal and ask for the bill early.

  - name: {en: "Burano pier — vaporetto 12 to Fondamente Nove", ru: "Причал Бурано — вапоретто № 12 до Фондаменте-Нове"}
    place: "45.48761,12.41600"
    lat: 45.48761
    lng: 12.41600
    walk_min: 5
    visit_min: [40, 45]
    short:
      ru: |
        Первый катер после обеда, около 17:00. Линия **12** в сторону **Fondamente Nove**, около 40 минут (через Маццорбо и Мурано-Фаро).
      en: |
        The first boat after lunch, around 17:00. Line **12** towards **Fondamente Nove**, about 40 minutes (via Mazzorbo and Murano Faro).
    long:
      ru: |
        Обратный путь через лагуну ведёт прямо на закат: около 17:00 солнце садится за Каннареджо, и послесвечение над водой, силуэты колоколен на фоне неба — один из лучших видов дня. Перед Фондаменте-Нове катер проходит вдоль стены Сан-Микеле, где вы были утром.

        Совет: к 17:00 основной поток экскурсионных групп уже уехал, но если первый катер полный — следующий через полчаса, катера ходят до позднего вечера. Катер идёт к городу, и закат — впереди: садитесь у окна по ходу движения.
      en: |
        The trip back across the lagoon heads straight into the sunset: around 17:00 the sun goes down behind Cannaregio, and the afterglow over the water, with the bell towers silhouetted against the sky, is one of the best views of the day. Just before Fondamente Nove the boat runs along the wall of San Michele, where you were this morning.

        Tip: by 17:00 most tour groups have gone, but if the first boat is full the next is half an hour later, and boats run until late evening. The boat heads towards the city with the sunset ahead, so sit facing forward.

  - name: {en: "Fondamente Nove — vaporetto 4.1 to Orto", ru: "Фондаменте-Нове — вапоретто 4.1 до Orto"}
    place: "45.44396,12.33916"
    lat: 45.44396
    lng: 12.33916
    radius_m: 200
    visit_min: [10, 15]
    short:
      ru: |
        Пересадка: линия **4.1** в сторону Orto / Piazzale Roma, одна остановка до **Orto** (Мадонна-дель-Орто), около 5 минут. Причал 4.1 — по табло, на соседнем понтоне.
      en: |
        Change here: line **4.1** towards Orto / Piazzale Roma, one stop to **Orto** (Madonna dell'Orto), about 5 minutes. Find the 4.1 pontoon on the boards; it's next door.
    long:
      ru: |
        **Фондаменте-Нове** — длинная набережная северного берега, построенная в XVI веке, с видом на лагуну и Сан-Микеле.

        Совет: если устали, оставайтесь на 4.1 дальше — она идёт вдоль северного берега через Guglie прямо до Piazzale Roma.
      en: |
        **Fondamente Nove** is the long northern quay, built in the 16th century, looking out over the lagoon and San Michele.

        Tip: if you're tired, stay on the 4.1 — it carries on along the north shore via Guglie straight to Piazzale Roma.

  - name: {en: Madonna dell'Orto, ru: Мадонна-дель-Орто}
    place: "Madonna dell'Orto, Venezia"
    lat: 45.44619
    lng: 12.33243
    inside: [{name: Campo dei Mori, lat: 45.44555, lng: 12.33210}]
    walk_min: 2
    visit_min: 15
    short:
      ru: |
        Готическая церковь Тинторетто в 2 минутах от причала Orto. Около 18:00 она уже закрыта и стемнеет, так что смотрим фасад и кампо деи Мори с каменными «маврами» при фонарях.
      en: |
        Tintoretto's Gothic church, 2 minutes from the Orto pier. By about 18:00 it's closed and dark, so see the façade and Campo dei Mori with its stone "Moors" by lamplight.
    long:
      ru: |
        Церковь XV века названа в честь статуи Мадонны, найденной, по преданию, в соседнем огороде (*orto*). Это приходская церковь **Тинторетто**: здесь он похоронен, а внутри — его огромные «Страшный суд» и «Введение во храм». Кирпичный фасад с белым камнем — один из лучших образцов венецианской готики.

        Что посмотреть: рядом — **кампо деи Мори** с каменными фигурами в тюрбанах. Это, по преданию, братья Мастелли, купцы из греческой Мореи, поселившиеся здесь в XII веке; у одного, «синьора Риобы», железный нос — тереть его считается на удачу. На соседней набережной Фондамента деи Мори, в доме № 3399, жил Тинторетто.

        Совет: здесь уже совсем тихо — местные на вечерней прогулке и почти никаких туристов. Дальше — через мост на юг, на Фондамента делла Мизерикордия.
      en: |
        The 15th-century church is named after a statue of the Virgin found, legend says, in a nearby vegetable garden (*orto*). It was **Tintoretto's** parish church: he is buried here, and inside are his huge "Last Judgement" and "Presentation of the Virgin". The brick façade trimmed with white stone is one of the finest examples of Venetian Gothic.

        Next door is **Campo dei Mori** with its turbaned stone figures. Tradition says they are the Mastelli brothers, merchants from the Morea in Greece who settled here in the 12th century; one of them, "Sior Rioba", has an iron nose that people rub for luck. On the next quay, Fondamenta dei Mori, Tintoretto lived at no. 3399.

        Tip: it's truly quiet here: locals out for an evening walk and hardly any tourists. Next, cross the bridge south to the Fondamenta della Misericordia.

  - name: {en: "Evening on the Misericordia and Ormesini", ru: "Вечер на Мизерикордии и Ормезини"}
    place: "Fondamenta degli Ormesini, Venezia"
    lat: 45.44514
    lng: 12.32990
    radius_m: 300
    approach: [{name: Fondamenta della Misericordia, lat: 45.44408, lng: 12.33224}]
    walk_min: 5
    visit_min: [60, 90]
    short:
      ru: |
        Две набережные вдоль одного канала — любимое вечернее место венецианцев: бакари и столики прямо у воды. После дегустации — спритц и пара чикетти вместо ужина.
      en: |
        Two quays along one canal, the Venetians' favourite evening spot: bacari and tables right by the water. After the tasting lunch, a spritz and a few cicchetti instead of dinner.
    long:
      ru: |
        **Фондамента делла Мизерикордия** переходит в **Фондамента дельи Ормезини** — это один длинный канал, вдоль которого в субботний вечер собирается полгорода. Здесь пьют спритц стоя у воды, переходят из бара в бар и перекусывают чикетти — венецианскими закусками на один укус. Цены — местные, публика — тоже.

        Что посмотреть: известные адреса — **Al Timon** со столиками на пришвартованной лодке и **Il Paradiso Perduto** с длинными общими столами и иногда живой музыкой; на Ормезини — несколько винных баров с натуральными винами. Выбирайте по настроению и очереди.

        Совет: в бакаро чикетти выбирают у стойки, показывая пальцем. Сегодня Хеллоуин — в барах может быть шумнее обычного; если захочется тишины, сядьте на дальнем конце Ормезини.
      en: |
        The **Fondamenta della Misericordia** runs into the **Fondamenta degli Ormesini** — one long canal where half the city gathers on a Saturday night. People drink spritz standing by the water, hop from bar to bar and snack on cicchetti, Venetian one-bite nibbles. Local prices, local crowd.

        Well-known places include **Al Timon**, with tables on a moored boat, and **Il Paradiso Perduto**, with long shared tables and sometimes live music; on the Ormesini there are a few wine bars pouring natural wines. Pick by mood and by the length of the queue.

        Tip: in a bacaro you pick cicchetti at the counter by pointing. It's Halloween today, so the bars may be noisier than usual; for somewhere calmer, try the far end of the Ormesini.

  - name: {en: The Ghetto, ru: Гетто}
    place: "Campo del Ghetto Novo, Venezia"
    lat: 45.44536
    lng: 12.32684
    inside: [{name: Ponte de Ghetto Vecchio, lat: 45.44529, lng: 12.32633}]
    walk_min: 3
    visit_min: 15
    short:
      ru: |
        Первое в мире гетто — тихая площадь с высокими домами. Сегодня суббота, шаббат: музей и синагоги закрыты. Ведите себя тихо.
      en: |
        The world's first ghetto — a quiet square ringed by tall houses. Today is Saturday, the Sabbath: the museum and synagogues are closed. Keep your voices down.
    long:
      ru: |
        В 1516 году республика обязала евреев Венеции жить на этом островке, где раньше была литейная (*getto* — «отливка»): так появилось слово «гетто». Ворота запирали на ночь, у мостов дежурила стража, которую оплачивала сама община. Места не хватало, и дома росли вверх — до семи-восьми этажей, самые высокие в городе тех времён.

        Что посмотреть: на **кампо дель Гетто Ново** — колодцы, синагоги, спрятанные на верхних этажах домов (их выдают ряды окон), и на стене — бронзовые барельефы Арбита Блатаса в память о депортированных во время Холокоста. Через мост — **Гетто Веккьо**, «старое гетто», которое, как ни странно, заселили позже.

        Совет: в обычные дни, кроме субботы, Еврейский музей проводит экскурсии по синагогам — если будете в Венеции снова, это стоит сделать. Отсюда через Гетто Веккьо выходите к мосту Гулье и причалу Guglie.
      en: |
        In 1516 the Republic required the Jews of Venice to live on this islet, once the site of a foundry (*getto*, a "casting"): that is where the word "ghetto" comes from. The gates were locked at night and guards, paid by the community itself, watched the bridges. Space was short, so the houses grew upwards, to seven or eight storeys, the tallest in the city at the time.

        On **Campo del Ghetto Novo** look for the wellheads, the synagogues hidden on the upper floors (rows of windows give them away), and, on a wall, Arbit Blatas's bronze reliefs commemorating the Jews deported in the Holocaust. Across the bridge is the **Ghetto Vecchio**, the "old ghetto", which, oddly, was settled later.

        Tip: on other days, not Saturdays, the Jewish Museum runs synagogue tours — worth it if you come back to Venice. From here go through the Ghetto Vecchio to the Ponte delle Guglie and the Guglie pier.

  - name: {en: "Guglie — vaporetto to Piazzale Roma", ru: "Гулье — вапоретто до Пьяццале Рома"}
    place: "45.44345,12.32590"
    lat: 45.44345
    lng: 12.32590
    walk_min: [4, 5]
    visit_min: [10, 15]
    short:
      ru: |
        Финиш. С причала **Guglie** у моста — линия **4.1** или **5.1** в сторону **Piazzale Roma**, около 10 минут. Дальше автобус № 6 до Via Paleocapa, последние рейсы — 23:10, 23:25, 23:50.
      en: |
        Finish. From the **Guglie** pier by the bridge take line **4.1** or **5.1** towards **Piazzale Roma**, about 10 minutes. Then bus no. 6 to Via Paleocapa, last departures 23:10, 23:25, 23:50.
    long:
      ru: |
        Катер выходит из канала Каннареджо на Гранд-канал у вокзала и через несколько минут причаливает на Пьяццале Рома — без моста Конституции со стеклянными ступенями.

        Совет: проездной на 72 часа действует до воскресенья, так что и катер, и автобус им покрыты. Вечером катера ходят реже — смотрите табло.
      en: |
        The boat leaves the Cannaregio Canal for the Grand Canal by the station and docks at Piazzale Roma a few minutes later — no glass-stepped Ponte della Costituzione.

        Tip: the 72-hour pass runs until Sunday, so the boat and the bus are covered. Boats are less frequent in the evening — check the board.
