    short:
      ru: |
        Центральный, самый большой купол — над пересечением рукавов креста. Встаньте под ним, насколько позволяет маршрут, и поднимите голову.
      en: |
        The central and largest dome is over the crossing of the arms of the cross. Stand beneath it as far as the route allows, and look up.
    long:
      ru: |
        Это **Вознесение**, мозаика конца XII века, и это главный купол собора — около тринадцати метров в поперечнике.

        Начните с самого центра. Христос сидит на радуге, как на троне, в круге-небе, и этот круг уносят вверх четыре ангела — посмотрите, как они изогнулись от усилия. Ниже, по кругу, стоят Богоматерь между двумя ангелами в белом и двенадцать апостолов. Апостолы запрокинули головы, кто-то прикрывает глаза рукой, кто-то разводит руками: они только что увидели, как Учитель поднимается на небо. Между ними — деревья: всё происходит на Масличной горе.

        Ещё ниже, между окнами, идёт хоровод из шестнадцати женских фигур. Это добродетели и блаженства: Вера, Надежда, Милосердие, Терпение, Смирение, Целомудрие и другие; над каждой подписано её латинское имя. Милосердие, «мать всех добродетелей», отмечено короной. Здесь мастера позволили себе живость: фигуры словно танцуют, у каждой свой жест и свой предмет в руках.

        В парусах — треугольниках, на которые опирается купол, — четыре евангелиста за письменными столами. Под каждым — фигура, льющая воду из кувшина: четыре райские реки, Тигр, Евфрат, Фисон и Геон. Смысл простой: Евангелие, как реки из рая, растекается по всему миру.

        Совет: купол легче рассмотреть, отойдя на шаг-два назад, — так видно и верхний круг, и хоровод добродетелей. А по сторонам от алтарной преграды, впереди, — две мраморные кафедры. С правой, по традиции, народу впервые показывали только что избранного дожа. Дальше маршрут ведёт вправо, к южному рукаву креста, или прямо к преграде — смотрите по указателям.
      en: |
        This is the **Ascension**, a late 12th-century mosaic and the basilica's main dome, about thirteen metres across.

        At the centre Christ sits on a rainbow inside a circle of heaven that four angels, straining, carry upwards. Below, all round, are the Virgin between two angels in white and the twelve apostles, heads thrown back, shading their eyes or spreading their hands as they watch; trees between them place the scene on the Mount of Olives. Lower still, between the windows, sixteen female figures dance in a ring — the Virtues and Beatitudes, each labelled in Latin, with Charity, "mother of all virtues", crowned.

        In the pendentives are the four Evangelists at their desks, and below each a figure pouring water: the four rivers of Paradise, the Gospel flowing out over the world.

        Tip: step back a little to see both the top circle and the ring of Virtues. Ahead, either side of the screen, stand two marble pulpits; from the right-hand one, by tradition, a newly elected Doge was first shown to the people. Then the route leads right to the south transept, or straight to the screen — follow the signs.

  - name: { en: "South transept: finding St Mark's body (if it's on your route)", ru: "Южный трансепт: обретение мощей (если маршрут проходит мимо)" }
    place: "Basilica di San Marco, Tesoro di San Marco, Venezia"
    lat: 45.43440
    lng: 12.34002
    radius_m: 40
    walk_min: 1
    visit_min: [ 3, 5 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/06.mp3 }
    short:
      ru: |
        Если маршрут проходит мимо: правый, южный рукав креста. На его западной стене — мозаика о том, как нашли пропавшее тело святого Марка; рядом — вход в Сокровищницу (отдельный билет).
      en: |
        If it's on your route: the right-hand, southern arm of the cross. On its west wall is the mosaic of how St Mark's lost body was found; nearby is the door to the Treasury (separate ticket).
    long:
      ru: |
        Это самая детективная история собора. В 976 году венецианцы восстали против дожа Пьетро Кандиано, подожгли его дворец, и огонь перекинулся на старую церковь Святого Марка. Церковь отстроили, потом начали строить нынешний собор, а мощи святого всё это время держали в тайнике, о котором знали лишь немногие. Тайна умерла вместе с ними: к концу XI века никто уже не знал, где лежит святой Марк.

        Когда в 1094 году новый собор готовили к освящению, дож, духовенство и весь народ, как рассказывает предание, три дня постились и молились, чтобы святой открыл себя. И во время молитвы камни одной из колонн выпали, а за ними показался ларец с мощами. Венецианцы называют это чудо **Apparitio** — «явление».

        Найдите на западной стене трансепта большую мозаику XIII века. Слева — молитва: впереди процессии дож в красной шапке, над ним подписано «DUX», рядом епископ и духовенство, за ними горожане. Справа — колонна открылась, и все благодарят. Присмотритесь к фону: мастера изобразили интерьер этого самого собора, с его арками и куполами, — вы стоите внутри той же картины, которую видите на стене.

        Купол над этим рукавом — купол святых: на кресте в центре — святые Николай, Климент, Власий и Леонард.

        Здесь же — вход в **Сокровищницу** (Tesoro), по отдельному билету. Там хранятся чаши, реликварии и оклады, большей частью византийские, вывезенные из Константинополя в 1204 году. Если на неё нет времени — не страшно: главное золото собора — над головой.
      en: |
        This is the basilica's detective story. In 976 Venetians rose against Doge Pietro Candiano and set fire to his palace, and the flames spread to the old St Mark's. While the church was rebuilt and the present one begun, the relics were kept in a hiding place known to very few — and by the late 11th century nobody knew where St Mark lay.

        When the new basilica was being prepared for consecration in 1094, tradition says the Doge, clergy and people fasted and prayed for three days, and during the prayer stones fell from a pillar, revealing the casket. Venetians call the miracle the **Apparitio**.

        On the west wall of the transept, a large 13th-century mosaic tells it: on the left the procession at prayer, led by the Doge in a red cap labelled "DUX"; on the right the open pillar and the thanksgiving. The background shows this very interior, arches and domes — you're standing inside the picture you're looking at. The dome above shows four saints: Nicholas, Clement, Blaise and Leonard.

        Here too is the door to the **Treasury** (separate ticket): chalices, reliquaries and covers, mostly Byzantine, carried off from Constantinople in 1204.

  - name: { en: "The iconostasis and the presbytery", ru: "Алтарная преграда и пресвитерий" }
    place: "Basilica di San Marco, Venezia"
    lat: 45.43458
    lng: 12.34018
    radius_m: 40
    walk_min: 1
    visit_min: [ 4, 6 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/07.mp3 }
    short:
      ru: |
        Мраморная преграда с рядом статуй отделяет неф от алтарной части. За ней, над алтарём, — мощи святого Марка и Пала д'Оро (за отдельный билет).
      en: |
        A marble screen topped by a row of statues separates the nave from the altar area. Behind it, at the altar, are the relics of St Mark and the Pala d'Oro (separate ticket).
    long:
      ru: |
        ![Алтарная преграда собора Святого Марка](https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Ikonostase2.jpg/960px-Ikonostase2.jpg)
        *Фото: общественное достояние*

        Преграду из цветного мрамора поставили в 1394 году братья **Якобелло и Пьерпаоло далле Мазенье**. По её верху — четырнадцать мраморных статуй: в центре Богоматерь и святой Марк, по сторонам двенадцать апостолов, а над ними большое распятие. Посмотрите на лица и складки одежд: это уже готика, живые, повёрнутые друг к другу фигуры, совсем не похожие на неподвижных византийских святых в мозаиках над ними. Сама идея преграды — западный отклик на православный иконостас: за ней, в **пресвитерии**, служили духовенство и сидел дож, а народ стоял в нефе. Пресвитерий приподнят: под ним — крипта, самая старая часть собора.

        Под главным алтарём покоятся **мощи святого Марка**, ради которых и построен собор. По преданию, в 828 году два венецианских купца, Буоно из Маламокко и Рустико из Торчелло, выкрали тело евангелиста из Александрии. Чтобы мусульманские таможенники не стали досматривать груз, тело прикрыли свининой, и стражники, увидев её, с отвращением отступили. По дороге корабль попал в бурю, и, как гласит легенда, святой Марк сам разбудил капитана и спас судно. С тех пор лев святого Марка — герб Венеции.

        За алтарём — **Пала д'Оро**, золотой алтарный образ. Его заказали в Константинополе в 976 году, потом не раз расширяли, в том числе эмалями, вывезенными в 1204 году, а в 1345 году ювелир Джованни Паоло Бонинсенья придал ему нынешний вид: около двух тысяч драгоценных камней и жемчужин. Вход к нему — отдельный, по своему билету; в ваш билет он не входит.
      en: |
        ![The rood screen of St Mark's](https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Ikonostase2.jpg/960px-Ikonostase2.jpg)
        *Photo: public domain*

        The coloured-marble screen was set up in 1394 by the brothers **Jacobello and Pierpaolo dalle Masegne**. Along its top stand fourteen marble statues: the Virgin and St Mark in the middle, the twelve apostles either side, and above them a great crucifix. Note the faces and drapery — Gothic figures turning to one another, quite unlike the still Byzantine saints in the mosaics above. Behind the screen, in the raised **presbytery** over the crypt, the clergy served and the Doge sat, while the people stood in the nave.

        Under the high altar lie the **relics of St Mark**. By tradition, in 828 two Venetian merchants, Buono of Malamocco and Rustico of Torcello, stole the body from Alexandria, hiding it under pork so the Muslim customs officers recoiled; on the way home, legend says, St Mark woke the captain in a storm and saved the ship.

        Behind the altar is the **Pala d'Oro**, a golden altarpiece ordered in Constantinople in 976, enlarged several times — including with enamels carried off in 1204 — and given its present form in 1345 by the goldsmith Giovanni Paolo Boninsegna, with about two thousand gems and pearls. It has its own entrance and ticket, not included in yours.

  - name: { en: "The Emmanuel dome and the apse", ru: "Купол Эммануила и апсида" }
    place: "Basilica di San Marco, Venezia"
    lat: 45.43458
    lng: 12.34035
    radius_m: 40
    walk_min: 1
    visit_min: [ 3, 5 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/08.mp3 }
    short:
      ru: |
        Над пресвитерием, за преградой, — восточный купол с молодым Христом и пророками, а ещё дальше, в полукруглой апсиде, — Христос Вседержитель. Если маршрут не подводит ближе, смотрите поверх преграды.
      en: |
        Over the presbytery, beyond the screen, is the east dome with the young Christ and the prophets, and further back, in the curved apse, Christ Pantocrator. If the route doesn't take you closer, look over the screen.
    long:
      ru: |
        Этот купол — начало всей истории, которую рассказывает собор. Здесь ещё никто не родился: пророки только предсказывают приход Спасителя.

        В центре, в круге с радугой — это небосвод, — сидит среди звёзд молодой, безбородый Христос со свитком закона. Это **Эммануил**, что значит «С нами Бог»: так называл будущего Спасителя пророк Исайя. Ниже, по кругу, — Богоматерь с поднятыми в молитве руками, а вокруг неё тринадцать пророков, у каждого — развёрнутый свиток с его пророчеством. Найдите Исайю: он указывает на Христа, и на его свитке — «Се, Дева во чреве примет». А царь Давид одет как византийский император, в короне и пурпуре: Спаситель должен был родиться из его царского рода. Мозаики этого купола — одни из самых ранних в соборе, XII века.

        Теперь посмотрите дальше, в полукруглую апсиду за алтарём. Там — огромный **Христос Вседержитель** на троне, благословляющий правой рукой. Эту фигуру переложили заново в начале XVI века, а ниже, между окнами, сохранились старые, XII века, четыре святых — покровителя Венеции: Николай, Пётр, Марк и Гермагор, ученик Марка и первый епископ Аквилеи.

        Обратите внимание, как выстроен весь собор: от Ветхого Завета в притворе — через Пятидесятницу и Вознесение — к пророкам и Христу здесь, на востоке. Вы прошли его как книгу, от первой главы к главной.
      en: |
        This dome is where the basilica's story begins: no one is born yet, and the prophets are only foretelling the Saviour.

        In the centre, in a rainbow circle — the firmament — the young, beardless Christ sits among stars holding the scroll of the law: **Emmanuel**, "God with us", as Isaiah called the coming Saviour. Below, the Virgin raises her hands in prayer among thirteen prophets with their scrolls. Isaiah points to Christ, his scroll reading "Behold, a virgin shall conceive"; King David is dressed as a Byzantine emperor, since the Saviour was to come from his royal line. These are among the basilica's earliest mosaics, 12th century.

        Beyond, in the apse, sits a great **Christ Pantocrator**, remade in the early 16th century; below him, between the windows, survive four older 12th-century saints, the patrons of Venice: Nicholas, Peter, Mark and Hermagoras. The whole building reads like a book, from Genesis in the narthex to the prophets and Christ here in the east.

  - name: { en: "North transept: the dome of St John (if it's on your route)", ru: "Северный трансепт: купол святого Иоанна (если маршрут проходит мимо)" }
    place: "Basilica di San Marco, Venezia"
    lat: 45.43472
    lng: 12.33995
    radius_m: 40
    walk_min: 1
    visit_min: [ 3, 5 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/09.mp3 }
    short:
      ru: |
        Если маршрут проходит мимо: левый, северный рукав креста. Над ним — купол святого Иоанна Богослова, а в восточной стене — капелла с иконой Никопеи.
      en: |
        If it's on your route: the left-hand, northern arm of the cross. Above it is the dome of St John the Evangelist, and in its east wall the chapel of the Nicopeia icon.
    long:
      ru: |
        Пять куполов собора стоят крестом: Пятидесятница на западе, Вознесение в центре, Эммануил на востоке, купол святых на юге — и этот, северный, посвящённый **святому Иоанну Богослову**, любимому ученику Христа.

        Купол поменьше центрального, и рассматривать его удобнее: сцены жизни и чудес Иоанна идут по кругу. Это не евангельские сюжеты, а поздние предания об апостоле: как он проповедовал в Эфесе, творил чудеса и спорил с язычниками. Ищите его по облику: в мозаиках Иоанна узнают по высокому лбу и седой бороде. А его символ — **орёл**: тот самый, что вы видели среди евангелистов в парусах центрального купола.

        Почему Иоанн? Он был одним из главных святых для Византии, а собор строили по образцу константинопольской церкви Святых Апостолов. Венецианцы взяли у Константинополя не только мрамор и золото, но и сам план — крест с пятью куполами.

        Посмотрите и вниз, на северную стену: если открыта соседняя **капелла Масколи**, в ней — мозаики XV века о жизни Богоматери, уже совсем ренессансные, с перспективой и архитектурой, как на картинах. Сравните их с византийским золотом над головой — между ними три века.

        А теперь — главная святыня Венеции: капелла с горящими свечами в восточной стене этого же рукава.
      en: |
        The basilica's five domes form a cross: Pentecost to the west, the Ascension in the centre, Emmanuel to the east, the saints to the south, and this northern one dedicated to **St John the Evangelist**, the beloved disciple.

        It's smaller than the central dome and easier to read: scenes of John's life and miracles run round it — not Gospel stories but later traditions of his preaching in Ephesus and his wonders. His symbol is the **eagle**, as among the Evangelists in the central dome's pendentives. The plan itself — a cross with five domes — was borrowed from the Church of the Holy Apostles in Constantinople.

        If the neighbouring **Mascoli Chapel** is open, its 15th-century mosaics of the Life of the Virgin are already Renaissance, with perspective and architecture — three centuries after the gold above.

        Next, the chapel with candles in the east wall of this arm.

  - name: { en: "The Madonna Nicopeia", ru: "Икона Богоматери Никопеи" }
    place: "Basilica di San Marco, Cappella della Madonna Nicopeia, Venezia"
    lat: 45.43476
    lng: 12.34005
    radius_m: 40
    walk_min: 1
    visit_min: [ 3, 5 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/10.mp3 }
    short:
      ru: |
        В левом, северном рукаве креста — капелла с горящими свечами и тёмной иконой в драгоценном окладе. Это Никопея, главная святыня Венеции.
      en: |
        In the left, northern arm of the cross is a chapel with burning candles and a dark icon in a jewelled frame. This is the Nicopeia, Venice's most venerated image.
    long:
      ru: |
        ![Богоматерь Никопея](https://upload.wikimedia.org/wikipedia/commons/e/ed/Nicopeia.jpg)
        *Фото: автор неизвестен, общественное достояние*

        **Никопея** значит «Победоносная», «Несущая победу». Это византийская икона Богоматери с Младенцем, написанная, как считается, в XII веке. Посмотрите, как она устроена: Богоматерь стоит прямо, фронтально, и держит Младенца перед собой, у груди, обеими руками, как держат знамя или святыню. Младенец благословляет. Лики потемнели от веков и свечного дыма, а золото и эмали вокруг сияют — так и задумано: тёмный лик в светящейся раме.

        В Константинополе с этой иконой ходили в военные походы: её несли перед войском, чтобы она принесла победу, — отсюда и имя. В 1204 году, когда крестоносцы и венецианцы взяли Константинополь, икону привезли в Венецию, и с тех пор она — покровительница города. К ней обращались во время чумы, войн и наводнений, и в самые тяжёлые дни её выносили в торжественных процессиях. Драгоценная рама с эмалями и камнями сделана позже, уже в Венеции.

        Это место, где до сих пор молятся: перед иконой горят свечи, и люди стоят на коленях. Если хотите, можно поставить свечу. Говорите тихо и не задерживайте проход.

        Отсюда маршрут ведёт к выходу. Оглянитесь напоследок на центральный купол — с этой стороны золото видно в другом свете. После собора заберите вещи в Атенео Сан-Бассо и идите обедать: садитесь за стол до 14:30.
      en: |
        ![The Madonna Nicopeia](https://upload.wikimedia.org/wikipedia/commons/e/ed/Nicopeia.jpg)
        *Photo: unknown author, public domain*

        **Nicopeia** means "bringer of victory". It's a Byzantine icon of the Virgin and Child, thought to date from the 12th century. The Virgin stands frontally, holding the Child before her chest with both hands, like a standard; the Child blesses. The faces have darkened with age and candle smoke, while the gold and enamels around them glow.

        In Constantinople it was carried before the army on campaign — hence the name. In 1204 the Venetians brought it home, and ever since it has been the city's protector, carried in procession in times of plague, war and flood. The jewelled, enamelled frame was made later, in Venice.

        People still pray here: candles burn and people kneel. Keep your voice down and don't block the way.

        From here the route leads to the exit. Look back at the central dome on the way — the gold looks different from this side. Then collect your bags at the Ateneo San Basso and go to lunch: be seated by 14:30.
