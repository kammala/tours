country: { en: Italy, ru: Италия }
city: { en: Venice, ru: Венеция }
name: { en: "Fri 30 Oct · St Mark's Basilica step by step", ru: "Пт, 30 окт · Собор Святого Марка по шагам" }
place_suffix: Venezia
summary:
  ru: "Около 50 минут снаружи и внутри; вход в 13:30. Аудиогид на русском в каждой точке, всего около 20 минут"
  en: "About 50 minutes outside and in; entry at 13:30. Russian audio at every stop, about 20 minutes in all"
intro:
  ru: |
    Подробная прогулка по собору Святого Марка — дневная часть дня «Дворец дожей, Сан-Марко, Салюте и закат на Дзаттере». Две точки снаружи — пока выходите из дворца и ждёте встречи, — и восемь внутри, по пути посетителей: притвор, неф, центральный купол, южный трансепт, алтарная преграда, восточный купол, северный трансепт и икона Никопеи. Две точки с пометкой «если маршрут проходит мимо» — смотрите по указателям, куда ведут мостки. У каждой точки есть **аудиорассказ на русском** — откройте точку и нажмите ▶.

    **Наушники.** Внутри вслух не говорят, поэтому без наушников не обойтись; можно по одному на двоих. Всего аудио около **20 минут** на 40–50 минут внутри: включайте рассказ и идите дальше, не дожидаясь конца, — он догонит вас у следующей точки.

    **Вход.** Бронь на **13:30**, на троих; войти нужно до **14:00**. **Встреча в 13:15** у камеры хранения в **Атенео Сан-Бассо** — на маленькой площади со львами, слева от собора: рюкзаки и большие сумки сдают туда, бесплатно, на час. С QR-кодом — в очередь для посетителей с бронью у главного фасада.

    **Одежда.** Плечи и колени закрыты, без головных уборов у мужчин; шарф или кофта на плечи решают вопрос.

    **Внутри.** Около **40–50 минут**. Посетители идут по одностороннему маршруту, частью по деревянным мосткам над старинным полом — сходить с них нельзя, вернуться назад тоже. Пол неровный, кое-где ступени — смотрите под ноги. Скамеек почти нет. Фото и видео внутри, как правило, запрещены — смотрите таблички у входа и слушайтесь смотрителей.

    **Не входит в билет.** **Пала д'Оро** за главным алтарём, **Сокровищница** и **Музей** с лоджией и подлинными конями — отдельные билеты, их покупают внутри у входа в каждую часть.

    *Фото: Wikimedia Commons, авторы и лицензии — под каждым снимком.*
  en: |
    A detailed walk round St Mark's Basilica — the afternoon part of "Doge's Palace, St Mark's, the Salute and sunset on the Zattere". Two stops outside — as you leave the palace and while you wait for the meet-up — and eight inside, along the visitors' route: the narthex, the nave, the central dome, the south transept, the rood screen, the east dome, the north transept and the Nicopeia icon. Two are marked "if it's on your route" — follow the signs for where the walkways go. Every stop has a **Russian audio narration** — open the stop and press ▶ (English listeners can read the text).

    **Headphones.** Talking aloud isn't allowed inside, so bring headphones; one earbud each works for two. There's about **20 minutes** of audio for a 40–50 minute visit: start a clip and keep walking — it'll catch up with you at the next stop.

    **Entry.** Booked for **13:30**, for three; you must go in by **14:00**. **Meet at 13:15** at the left-luggage office in the **Ateneo San Basso**, on the little square with the lions to the left of the basilica: backpacks and large bags go there, free, for up to an hour. Then join the queue for booked visitors at the main façade with the QR code.

    **Dress.** Shoulders and knees covered, men without hats; a scarf or cardigan over the shoulders does the job.

    **Inside.** About **40–50 minutes**. Visitors follow a one-way route, partly on wooden walkways over the ancient floor — no stepping off, and no going back. The floor is uneven, with a few steps here and there, so watch your feet. There's hardly anywhere to sit. Photos and video are generally not allowed inside — check the signs at the door and follow the attendants.

    **Not in your ticket.** The **Pala d'Oro** behind the high altar, the **Treasury** and the **Museum** with the loggia and the original horses all have their own tickets, sold inside at the entrance to each.

    *Photos: Wikimedia Commons; authors and licences under each picture.*
outro:
  ru: |
    Дальше по плану дня — [обед у Рива-дельи-Скьявони](#/tour/italy/07-venice-san-marco-dorsoduro/6): заберите вещи в Атенео Сан-Бассо и идите на набережную. Садитесь за стол до 14:30 — потом многие кухни перестают принимать заказы.
  en: |
    Next in the day plan: [lunch off the Riva degli Schiavoni](#/tour/italy/07-venice-san-marco-dorsoduro/6). Collect your bags at the Ateneo San Basso and head for the waterfront. Be seated by 14:30 — many kitchens stop taking orders after that.
points:
  - name: { en: "The Tetrarchs and the Pilastri Acritani", ru: "Тетрархи и Акрские столбы" }
    place: "Monumento ai Tetrarchi, Basilica di San Marco, Venezia"
    lat: 45.43423
    lng: 12.33985
    radius_m: 40
    visit_min: [ 3, 5 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/01.mp3 }
    short:
      ru: |
        Выйдя из дворца через Порта-делла-Карта, сразу поверните к углу собора: в стену вмурованы четыре фигуры из тёмно-красного камня, а рядом стоят два высоких резных столба.
      en: |
        Coming out of the palace through the Porta della Carta, turn straight to the corner of the basilica: four figures in dark red stone are set into the wall, and two tall carved pillars stand nearby.
    long:
      ru: |
        ![Тетрархи на углу собора Святого Марка](https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Portrait_of_the_Four_Tetrarchs_%28Monumento_ai_Tetrarchi%29%2C_San_Marco%2C_Venice_%2823809990288%29.jpg/960px-Portrait_of_the_Four_Tetrarchs_%28Monumento_ai_Tetrarchi%29%2C_San_Marco%2C_Venice_%2823809990288%29.jpg)
        *Фото: Dimitris Kamaras, CC BY 2.0*

        Четыре обнявшихся воина — **Тетрархи**, четыре соправителя Римской империи около 300 года нашей эры: два старших императора и два младших. Они высечены из **порфира**, пурпурного камня, который в Риме полагался только императорам. Обнимаются они в знак единства власти — а руки при этом держат на мечах. Скульптуру привезли из Константинополя после того, как крестоносцы и венецианцы разграбили город в 1204 году. Посмотрите на ноги: у одной фигуры не хватает части ступни. Этот обломок в 1960-х нашли при раскопках в Стамбуле, и теперь он хранится в Археологическом музее Стамбула.

        Два белых столба с резьбой — **Акрские столбы**. Венецианцы веками считали, что это трофей из крепости Акра, взятой у генуэзцев в 1258 году. На самом деле их привезли тоже из Константинополя: раскопки 1960-х показали, что они из церкви Святого Полиевкта VI века. А у самого угла — обрубок порфировой колонны, **Пьетра-дель-Бандо**: с неё глашатаи зачитывали законы Республики.

        Теперь — кофе, а к 13:15 обойдите собор слева, к Атенео Сан-Бассо.
      en: |
        ![The Tetrarchs on the corner of St Mark's](https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Portrait_of_the_Four_Tetrarchs_%28Monumento_ai_Tetrarchi%29%2C_San_Marco%2C_Venice_%2823809990288%29.jpg/960px-Portrait_of_the_Four_Tetrarchs_%28Monumento_ai_Tetrarchi%29%2C_San_Marco%2C_Venice_%2823809990288%29.jpg)
        *Photo: Dimitris Kamaras, CC BY 2.0*

        The four embracing soldiers are the **Tetrarchs**, the four co-rulers of the Roman Empire around AD 300: two senior emperors and two junior ones. They're carved in **porphyry**, the purple stone reserved in Rome for emperors. They embrace as a sign of united power — while keeping their hands on their swords. The group was brought from Constantinople after the crusaders and the Venetians sacked the city in 1204. Look at the feet: one figure is missing part of a foot. That fragment turned up in excavations in Istanbul in the 1960s and is now in the Istanbul Archaeology Museum.

        The two white carved pillars are the **Pilastri Acritani**. For centuries Venetians believed they were a trophy from the fortress of Acre, taken from the Genoese in 1258. In fact they too came from Constantinople: excavations in the 1960s showed they belonged to the 6th-century church of St Polyeuktos. And right at the corner stands a stump of a porphyry column, the **Pietra del Bando**, from which heralds read out the Republic's laws.

        Now a coffee, and by 13:15 walk round the basilica to the left, to the Ateneo San Basso.

  - name: { en: "The façade, the horses and the Porta di Sant'Alipio", ru: "Фасад, кони и портал Сант-Алипио" }
    place: "Basilica di San Marco, Porta di Sant'Alipio, Venezia"
    lat: 45.43448
    lng: 12.33935
    radius_m: 60
    walk_min: 3
    visit_min: [ 5, 10 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/02.mp3 }
    short:
      ru: |
        Пока ждёте встречи у Атенео Сан-Бассо и стоите в очереди, посмотрите на фасад: пять порталов, над центральным — четыре бронзовых коня, а над крайним левым порталом — самая старая мозаика фасада.
      en: |
        While you wait for the meet-up at the Ateneo San Basso and stand in the queue, look at the façade: five portals, four bronze horses above the central one, and over the far-left portal the oldest mosaic on the front.
    long:
      ru: |
        ![Мозаика над порталом Сант-Алипио](https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Basilica_di_San_Marco_-_Porta_Sant%27Alipio_%28EOS5001403%29.jpg/960px-Basilica_di_San_Marco_-_Porta_Sant%27Alipio_%28EOS5001403%29.jpg)
        *Фото: Michael Wittwer, CC BY-SA 4.0*

        Встаньте напротив **крайнего левого портала** — это **Порта-ди-Сант-Алипио**. Мозаика над ним сделана около 1260–1270 годов, и это единственная мозаика фасада, сохранившаяся с тех пор; остальные заменили в XVII–XVIII веках. На ней — перенесение тела святого Марка в собор. Приглядитесь к зданию на мозаике: это сам собор, каким он был семьсот пятьдесят лет назад, — с куполами, пятью порталами и уже с четырьмя конями над входом.

        Кони наверху, на лоджии, — **копии**. Подлинники из позолоченной бронзы стоят внутри, в Музее собора, куда нужен отдельный билет. Кони, скорее всего, античные; они украшали ипподром Константинополя, и в 1204 году их привезли сюда как трофей. В 1797 году Наполеон увёз их в Париж и поставил на триумфальную арку Карусель, а в 1815 году их вернули. На место копий их поменяли в 1980-х, чтобы спасти от загрязнённого воздуха.

        Сам собор начали строить в 1063 году по образцу константинопольской церкви Святых Апостолов — поэтому он так непохож на соборы Западной Европы: крестообразный план, пять куполов, мрамор и золото. Колонны фасада — больше пятисот — во многом тоже трофеи, привезённые с Востока.
      en: |
        ![The mosaic over the Porta di Sant'Alipio](https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Basilica_di_San_Marco_-_Porta_Sant%27Alipio_%28EOS5001403%29.jpg/960px-Basilica_di_San_Marco_-_Porta_Sant%27Alipio_%28EOS5001403%29.jpg)
        *Photo: Michael Wittwer, CC BY-SA 4.0*

        Stand opposite the **far-left portal**, the **Porta di Sant'Alipio**. The mosaic above it was made around 1260–1270, and it's the only mosaic on the façade to survive from that time; the others were replaced in the 17th and 18th centuries. It shows the body of St Mark being carried into the basilica. Look closely at the building in the mosaic: it's the basilica itself as it was 750 years ago — with its domes, five portals and already the four horses over the entrance.

        The horses up on the loggia are **copies**. The gilded-bronze originals stand inside in the basilica's Museum, which needs a separate ticket. They're most likely ancient; they adorned the Hippodrome of Constantinople and were brought here as loot in 1204. In 1797 Napoleon took them to Paris and put them on the Arc du Carrousel; they came back in 1815. They were swapped for copies in the 1980s to save them from polluted air.

        The basilica itself was begun in 1063, modelled on the Church of the Holy Apostles in Constantinople — which is why it looks so unlike the cathedrals of western Europe: a cross-shaped plan, five domes, marble and gold. Many of the façade's more than five hundred columns are trophies from the East too.

  - name: { en: "The narthex and the Genesis cupola", ru: "Притвор и купол Сотворения мира" }
    place: "Basilica di San Marco, Venezia"
    lat: 45.43450
    lng: 12.33955
    radius_m: 40
    walk_min: 2
    visit_min: [ 5, 8 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/03.mp3 }
    short:
      ru: |
        Сразу за входом — **притвор**, длинная галерея перед самим собором. Поднимите голову: первый маленький купол справа — Сотворение мира.
      en: |
        Just inside the door is the **narthex**, a long gallery in front of the church proper. Look up: the first small dome on the right is the Creation of the world.
    long:
      ru: |
        ![Купол Сотворения мира в притворе](https://upload.wikimedia.org/wikipedia/commons/8/81/Fiat_lux_-_Cupola_of_Genesis_-_St._Mark%27s_Basilica_%28Venice%29.jpg)
        *Фото: автор неизвестен, общественное достояние*

        Мозаики притвора — Ветхий Завет, а сам собор внутри — Новый: чтобы войти к Христу, проходишь сначала через историю мира от его начала. Купол **Сотворения мира** выложили в первой половине XIII века.

        Читайте его от центра наружу, как спираль, тремя кругами. В самой середине — Дух Божий в виде птицы над тёмными водами. Дальше — отделение света от тьмы, небо, суша и море, солнце и луна, рыбы и птицы, звери. Создатель здесь всюду один и тот же: молодой, безбородый, с крестом на длинном древке — так византийские мастера показывали Слово, через которое сотворён мир. Каждый день творения отмечен ангелом, и с каждым днём ангелов становится на одного больше. На седьмой день Творец сидит на троне и благословляет седьмого ангела — день отдыха.

        Во внешнем круге — Адам и Ева. Найдите, как Творец лепит Адама из глины, а потом вдыхает в него жизнь — маленькую крылатую фигурку, душу. Дальше — Ева из ребра, змей у дерева, плоды, стыд, Бог, зовущий их в саду, и изгнание из рая. Мастера, как считается, копировали иллюстрации из раннехристианской рукописи Книги Бытия V–VI века, поэтому фигуры такие небольшие и «книжные».

        Дальше по притвору, если маршрут позволяет оглянуться, — истории Ноя и потопа, Авраама, Иосифа и Моисея. А на полу перед центральной дверью найдите **ромб из красного мрамора**. По преданию, здесь в 1177 году император Фридрих Барбаросса преклонил колени перед папой Александром III — Венеция их примирила и прославилась на всю Европу.

        Отсюда маршрут ведёт в сам собор. Перед порогом остановитесь на секунду: впереди будет темно, а потом — золото.
      en: |
        ![The Genesis cupola in the narthex](https://upload.wikimedia.org/wikipedia/commons/8/81/Fiat_lux_-_Cupola_of_Genesis_-_St._Mark%27s_Basilica_%28Venice%29.jpg)
        *Photo: unknown author, public domain*

        The narthex mosaics tell the Old Testament, the church inside the New: to reach Christ you first pass through the story of the world from its beginning. The **Creation cupola** was set in the first half of the 13th century.

        Read it from the centre outwards, in three rings: the Spirit as a bird over the dark waters, light divided from darkness, sky, land and sea, sun and moon, fish, birds and beasts. The Creator is always the same young, beardless figure with a long cross-staff — the Word through which the world was made. Each day is marked by an angel, one more every day; on the seventh the Creator sits enthroned and blesses the seventh angel. In the outer ring are Adam and Eve: Adam shaped from clay and given a tiny winged soul, Eve from the rib, the serpent, the fruit, and the expulsion. The mosaicists are thought to have copied an early Christian Genesis manuscript of the 5th–6th century.

        Further along the narthex come Noah, Abraham, Joseph and Moses. On the floor in front of the central door, find a **lozenge of red marble**: tradition says that here, in 1177, Emperor Frederick Barbarossa knelt before Pope Alexander III, reconciled by Venice.

        From here the route leads into the church itself.

  - name: { en: "The nave: the Pentecost dome and the floor", ru: "Неф: купол Пятидесятницы и пол" }
    place: "Basilica di San Marco, Venezia"
    lat: 45.43455
    lng: 12.33972
    radius_m: 40
    walk_min: 1
    visit_min: [ 5, 8 ]
    audio: { ru: audio/italy/07-venice-st-marks-basilica/04.mp3 }
    short:
      ru: |
        Войдя в неф, остановитесь и дайте глазам привыкнуть к полумраку. Над вами — первый большой купол, Пятидесятница; под ногами — волнистый мозаичный пол.
      en: |
        Entering the nave, stop and let your eyes adjust to the gloom. Above you is the first great dome, Pentecost; under your feet, the undulating mosaic floor.
    long:
      ru: |
        Через минуту полумрак начинает светиться: золото покрывает купола, своды и арки — больше восьми тысяч квадратных метров мозаик. Окон мало, и это задумано: мерцающее золото в темноте должно было казаться небом. Каждый золотой кубик — это стекло, а под тонкой стеклянной плёнкой — листок настоящего золота. Мастера вдавливали кубики в штукатурку чуть под разными углами, поэтому золото не блестит ровно, как зеркало, а переливается, когда вы двигаетесь.

        Купол над входом — **Пятидесятница**, один из самых старых куполов собора, XII века. В центре — престол с голубем Святого Духа, от него двенадцать лучей идут к двенадцати апостолам, которые сидят по кругу, и над головой у каждого — язычок пламени. Теперь опустите взгляд ниже, между окнами: там стоят пары людей в разных одеждах и шапках. Это народы, о которых рассказывают Деяния апостолов: в день Пятидесятницы каждый из них услышал проповедь на своём языке. Над каждой парой подписано, что это за народ. Так купол объясняет, зачем апостолы разошлись по всему миру.

        Теперь посмотрите под ноги. **Пол** XII века — больше двух тысяч квадратных метров: геометрические узоры из цветного мрамора и мозаичные картинки — павлины, орлы, грифоны, олени. Где-то на полу есть и знаменитая сценка: два петуха несут на шесте связанную лису. Смотрите, не попадётся ли она вам по пути.

        Пол не ровный, а волнами. Собор стоит на деревянных сваях в илистой почве лагуны, и за девятьсот лет пол просел неравномерно. Вода — его главный враг: при высоком приливе море поднималось прямо в притвор. С 2020 года город защищают подвижные барьеры MOSE, а вокруг собора поставили ещё и стеклянную стенку. Поэтому посетителей и ведут по мосткам — не сходите с них и смотрите под ноги на стыках.
      en: |
        After a minute the gloom begins to glow: gold covers the domes, vaults and arches — more than eight thousand square metres of mosaic. Each gold tessera is glass with a leaf of real gold under a thin glass film, pressed into the plaster at slightly different angles, so the gold shimmers as you move rather than shining flat like a mirror.

        The dome over the entrance is **Pentecost**, one of the oldest, from the 12th century. In the centre is a throne with the dove of the Holy Spirit; twelve rays run to the twelve seated apostles, each with a tongue of flame above his head. Between the windows below stand pairs of people in different dress, each labelled: the nations who, as Acts tells it, heard the apostles in their own languages.

        Now look down. The 12th-century **floor** covers more than two thousand square metres: geometric marble patterns and mosaic peacocks, eagles, griffins and deer — and somewhere a famous little scene of two roosters carrying a trussed fox on a pole. It's wavy because the basilica stands on wooden piles in the lagoon mud and has sunk unevenly over nine centuries. High tides used to flood the narthex; since 2020 the MOSE barriers protect the city, and the basilica also has a glass wall round it. Keep to the walkways and watch the joins.

  - name: { en: "The Ascension dome", ru: "Купол Вознесения" }
    place: "Basilica di San Marco, Venezia"
