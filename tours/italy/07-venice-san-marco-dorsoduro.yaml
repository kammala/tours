country: {en: Italy, ru: Италия}
city: {en: Venice, ru: Венеция}
name: {en: "Fri 30 Oct · Strike day: Doge's Palace, St Mark's, the Salute and sunset on the Zattere", ru: "Пт, 30 окт · День забастовки: Дворец дожей, Сан-Марко, Салюте и закат на Дзаттере"}
place_suffix: Venezia
summary:
  ru: "≈ 6 км пешком, с 8:15 до вечера; забастовка ACTV — утром гарантированный катер до Риальто, дальше всё пешком; брони: дворец в 10:30, собор в 13:30"
  en: "≈ 6 km on foot, from 08:15 into the evening; ACTV strike — a guaranteed boat to the Rialto in the morning, everything else on foot; booked: the palace at 10:30, the basilica at 13:30"
intro:
  ru: |
    Пятница, 30 октября. **Общенациональная забастовка ACTV на 24 часа.** Гарантированы только:
    - **автобус № 6** — рейсы, отправляющиеся с конечной с **6:00 до 8:59** и с **16:30 до 19:29**;
    - **катер-челнок Пьяццале Рома → Ферровия → Риальто** — каждые 10 минут с **5:59 до 8:59** и с **16:19 до 19:29** (обратно от Риальто — 6:00–9:00 и 16:20–19:30);
    - **People Mover** — 7:10–9:50 и 16:40–19:20.

    Линии вапоретто **№ 1 и № 2 не ходят весь день**. Вне этих окон часть рейсов может выйти (в прошлую забастовку бастовала примерно половина водителей и две трети экипажей катеров), но рассчитывать на это нельзя. Комиссия по забастовкам нашла в объявлении нарушения, так что её ещё могут отменить или сократить — проверьте страницу ACTV или приложение AVM Venezia вечером накануне и утром. Проездной на 72 часа действует на всём, что ходит.

    Поэтому день пеший: утром — гарантированным транспортом до Риальто, дальше — ногами, с частыми остановками, а вечером — гарантированный автобус до 19:29 или такси.

    **Брони сделаны.**
    - **Дворец дожей** — **10:30**, на двоих (билет «Музеи площади Сан-Марко»; слот в музей Коррер в 16:50 — для галочки, идти не нужно). Очередь по брони с досмотром — 5–15 минут.
    - **Собор Святого Марка** — **13:30** (вход до 14:00), на троих. Пала д’Оро и Музей с лоджией коней в билет не входят.

    **Дорога.** Вдвоём — выход около **8:15**: автобус № 6 с Paleocapa около 8:30, на Пьяццале Рома — челнок до Риальто (сесть до 8:59), оттуда 10–15 минут пешком до Сан-Марко и спокойный кофе до 10:30. Третьему участнику — либо ехать вместе в 8:15 и провести утро самостоятельно (по пятницам утром работает рыбный рынок Риальто), либо позже взять такси до Пьяццале Рома (~€25–35, Radio Taxi Venezia: +39 041 5964) и дойти пешком до собора к **13:15** — около 45 минут.

    **Ритм.** Пешком сегодня около 6 км, но кусками по 10–35 минут: кофе после Риальто, кафе во дворе дворца, обед, скамейки на кампо Санто-Стефано, ступени Салюте, спритц на Дзаттере.

    Закат около **17:00** — его встречаем на Дзаттере. Салюте открывается после обеденного перерыва в 15:00.
  en: |
    Friday 30 October. **A 24-hour national ACTV strike.** The only guaranteed services are:
    - **bus no. 6** — departures leaving the terminus **06:00–08:59** and **16:30–19:29**;
    - **the shuttle boat Piazzale Roma → Ferrovia → Rialto** — every 10 minutes **05:59–08:59** and **16:19–19:29** (back from the Rialto 06:00–09:00 and 16:20–19:30);
    - **the People Mover** — 07:10–09:50 and 16:40–19:20.

    Vaporetto lines **1 and 2 don't run all day**. Outside those windows some services may run (at the last strike about half the bus drivers and two-thirds of the boat crews walked out), but don't count on it. The strike watchdog flagged problems with this strike, so it could still be called off or cut back — check the ACTV page or the AVM Venezia app the evening before and in the morning. The 72-hour pass is valid on whatever runs.

    So today is on foot: guaranteed transport to the Rialto in the morning, then walking with frequent stops, and in the evening a guaranteed bus before 19:29 or a taxi.

    **Booked.**
    - **Doge's Palace** at **10:30**, for two (the "St Mark's Square Museums" ticket; the 16:50 Museo Correr slot was only required to complete the purchase — no need to go). The booked queue plus security takes 5–15 minutes.
    - **St Mark's Basilica** at **13:30** (entry until 14:00), for three. The Pala d'Oro and the Museum with the Horses' Loggia aren't included.

    **Getting there.** The two of you leave around **08:15**: bus no. 6 from Paleocapa around 08:30, then the shuttle boat from Piazzale Roma to the Rialto (board before 08:59), a 10–15-minute walk to St Mark's and an unhurried coffee before 10:30. The third person either comes along at 08:15 and spends the morning on their own (the Rialto fish market is open on Friday mornings), or later takes a taxi to Piazzale Roma (~€25–35, Radio Taxi Venezia: +39 041 5964) and walks to the basilica for **13:15** — about 45 minutes.

    **Pace.** About 6 km on foot today, but in stretches of 10–35 minutes: coffee after the Rialto, the palace courtyard café, lunch, the benches in Campo Santo Stefano, the Salute steps, a spritz on the Zattere.

    Sunset is around **17:00**, to be watched from the Zattere. The Salute reopens after its lunch break at 15:00.
outro:
  ru: |
    Обратно — либо гарантированный автобус № 6 с Пьяццале Рома до 19:29, либо такси со стоянки на Пьяццале Рома до кемпинга (~€25–35, 10–15 минут; Radio Taxi Venezia: +39 041 5964). Если забастовку отменят, вечером автобусы ходят как обычно — последние рейсы в 23:10, 23:25 и 23:50.

    Завтра — острова: кладбище Сан-Микеле, Мурано, Бурано и обед в Gatto Nero, все вместе. Забастовка к тому времени закончится. Подъём около 8:30, выход около 9:45.
  en: |
    Head back either on a guaranteed bus no. 6 from Piazzale Roma before 19:29, or by taxi from the Piazzale Roma rank to the campsite (~€25–35, 10–15 minutes; Radio Taxi Venezia: +39 041 5964). If the strike is called off, evening buses run as usual — the last departures are at 23:10, 23:25 and 23:50.

    Tomorrow is the islands: San Michele cemetery, Murano, Burano and lunch at Gatto Nero, all together. The strike will be over by then. Up around 08:30, out around 09:45.
points:
  - name: {en: hu Venezia camping in town, ru: Кемпинг hu Venezia camping in town}
    place: "hu Venezia camping in town, Via Giuseppe De Marchi 7, Marghera"
    lat: 45.47240
    lng: 12.21200
    radius_m: 250
    short:
      ru: |
        Вдвоём — старт около **8:15**: забастовка, автобус № 6 гарантирован только до 8:59. Третий участник — вместе с вами или позже на такси. До остановки автобуса 12–15 минут пешком через подземный переход.
      en: |
        The two of you start around **08:15**: it's a strike day, and bus no. 6 is only guaranteed until 08:59. The third person comes with you or takes a taxi later. The bus stop is 12–15 minutes' walk through the underpass.
    long:
      ru: |
        Путь до остановки тот же, что вчера: велодорожка вдоль Via De Marchi, подземный переход под съездом, Via della Fonte мимо спортивного центра, налево по Via Cesare Beccaria до Via Paleocapa.

        Совет: проверьте, что билеты во дворец и собор открываются в телефоне без интернета (сделайте скриншоты QR-кодов), и перешлите третьему участнику его билет в собор — он именной. Возьмите шарф или кофту, чтобы прикрыть плечи в соборе, и небольшую сумку: с рюкзаком в собор не пустят.
      en: |
        Same way to the stop as yesterday: the cycle path along Via De Marchi, the underpass beneath the ramp, Via della Fonte past the sports centre, then left up Via Cesare Beccaria to Via Paleocapa.

        Tip: make sure the palace and basilica tickets open on your phone offline (screenshot the QR codes), and forward the third person their basilica ticket — it's in their name. Bring a scarf or cardigan to cover shoulders in the basilica, and a small bag: backpacks aren't allowed inside.

